<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Nanny Akademija • Obuka za predavače</title>
    
    <!-- Google Fonts: Libre Baskerville & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --c-dark: #47342E;
            --c-bg: #F7F5F0;
            --c-sand: #CDBBA0;
            --c-linen: #F0E9D7;
            --c-terra: #765535;
            --c-sage: #8B906D;
            --c-olive: #69614F;
            --c-gold: #D1AE66;
            --c-blush: #E7DBCE;
            --c-border: #E4DCCE;
            --c-card-bg: #FFFFFF;
            --c-text-muted: #7A7067;
            --font-title: 'Libre Baskerville', Georgia, serif;
            --font-body: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            --shadow-sm: 0 4px 12px rgba(71, 52, 46, 0.05);
            --shadow-md: 0 10px 30px rgba(71, 52, 46, 0.08);
            --shadow-lg: 0 20px 40px rgba(71, 52, 46, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: #1E1715;
            color: var(--c-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Progress Bar */
        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--c-sand), var(--c-gold));
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* App Header Controls */
        .top-navbar {
            height: 54px;
            background: #2D2320;
            color: var(--c-linen);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid rgba(205, 187, 160, 0.2);
            z-index: 100;
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo-img {
            height: 26px;
            filter: brightness(1.2);
        }

        .module-indicator {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--c-sand);
            font-weight: 600;
            background: rgba(205, 187, 160, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(205, 187, 160, 0.3);
        }

        .actions-zone {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.08);
            color: var(--c-linen);
            border: 1px solid rgba(205, 187, 160, 0.3);
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 12px;
            font-family: var(--font-body);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-nav:hover {
            background: var(--c-sand);
            color: var(--c-dark);
            border-color: var(--c-sand);
        }

        .btn-nav.active {
            background: var(--c-sand);
            color: var(--c-dark);
            font-weight: 600;
        }

        .btn-download-pptx {
            background: rgba(209, 174, 102, 0.18);
            border-color: var(--c-gold);
            color: var(--c-gold);
            font-weight: 600;
        }

        .btn-download-pptx:hover {
            background: var(--c-gold);
            color: var(--c-dark);
            border-color: var(--c-gold);
        }

        .slide-counter-badge {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--c-gold);
            padding: 0 10px;
        }

        /* Main Stage */
        .stage-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: calc(100vh - 52px - 34px);
            box-sizing: border-box;
        }

        .slide-deck-scaler {
            width: calc(1600px * var(--slide-scale, 1));
            height: calc(900px * var(--slide-scale, 1));
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: width 0.15s ease, height 0.15s ease;
        }

        /* Slide Frame: Exactly 16:9 Aspect Ratio Base Canvas (1600x900) */
        .slide-deck-frame {
            width: 1600px;
            height: 900px;
            background-color: var(--c-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(205, 187, 160, 0.25);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(var(--slide-scale, 1));
            transform-origin: center center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        /* Slide Container */
        .slide-content {
            width: 1600px;
            height: 900px;
            padding: 30px 48px 22px 48px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
        }

        .slide-content.dark-theme {
            background-color: var(--c-dark);
            color: var(--c-linen);
        }

        /* Header inside slide */
        .slide-inner-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .slide-titles-wrap {
            flex: 1;
        }

        .brand-eyebrow {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .rn-monogram-mark {
            height: 28px;
            width: auto;
            object-fit: contain;
        }

        .category-pill {
            display: inline-block;
            font-size: 12.5px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--c-terra);
        }

        .dark-theme .category-pill {
            color: var(--c-sand);
        }

        .slide-h1 {
            font-family: var(--font-title);
            font-size: 36px;
            font-weight: 700;
            line-height: 1.2;
            color: var(--c-dark);
            letter-spacing: -0.4px;
        }

        .dark-theme .slide-h1 {
            color: var(--c-linen);
        }

        .slide-h1 em {
            font-style: italic;
            font-family: var(--font-title);
            color: var(--c-terra);
            font-weight: 400;
        }

        .dark-theme .slide-h1 em {
            color: var(--c-gold);
            font-weight: 400;
        }

        .slide-sub {
            font-size: 17.5px;
            color: var(--c-olive);
            margin-top: 5px;
            font-weight: 400;
            line-height: 1.42;
        }

        .dark-theme .slide-sub {
            color: rgba(240, 233, 215, 0.75);
        }

        .slide-watermark-logo {
            height: 38px;
            opacity: 0.9;
        }

        /* Slide Body Layouts */
        .slide-body {
            flex: 1;
            display: flex;
            gap: 24px;
            min-height: 0;
        }

        /* Layout: Split Right Image (Root layout extending right edge up to logo) */
        .layout-split-image-root {
            display: grid;
            grid-template-columns: 1.04fr 0.96fr;
            gap: 28px;
            flex: 1;
            min-height: 0;
            height: calc(100% - 44px);
        }

        .split-left-main {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .split-left-main .slide-titles-wrap {
            margin-bottom: 14px;
            flex: 0 0 auto;
        }

        .split-left-main .split-text-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .split-left-main .split-text-col .proto-card {
            padding: 18px 24px;
        }

        .split-left-main .split-text-col .proto-card-title {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .split-left-main .split-text-col .proto-bullets {
            gap: 9px;
            justify-content: space-evenly;
            flex: 1;
        }

        .split-left-main .split-text-col .proto-bullets li {
            font-size: 15.5px;
            line-height: 1.48;
            padding-left: 18px;
        }

        .split-right-main {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .split-right-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 38px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .split-right-main .split-image-col {
            flex: 1;
            min-height: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--c-border);
            box-shadow: var(--shadow-sm);
            background: #EDE6D8;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .split-right-main .split-image-col img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .layout-split-image {
            display: grid;
            grid-template-columns: 1.04fr 0.96fr;
            gap: 24px;
            height: 100%;
            min-height: 0;
            flex: 1;
        }

        .split-text-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
            height: 100%;
            min-height: 0;
        }

        .split-image-col {
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--c-border);
            box-shadow: var(--shadow-sm);
            background: #EDE6D8;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .split-image-col img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .photo-overlay-badge {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(45, 35, 32, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }

        .photo-overlay-badge img {
            height: 15px;
            width: auto;
            object-fit: contain;
            filter: brightness(1.25);
        }

        /* Layout: Two Column Cards Full-Width */
        .layout-two-col-root {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            min-height: 0;
            box-sizing: border-box;
        }

        .layout-two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            flex: 1;
            min-height: 0;
            margin-bottom: 12px;
        }

        .layout-two-col .proto-card {
            background: var(--c-card-bg);
            border: 1px solid var(--c-border);
            border-left: 6px solid var(--c-terra);
            border-radius: 16px;
            padding: 26px 32px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        .dark-theme .layout-two-col .proto-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(205, 187, 160, 0.22);
            border-left: 6px solid var(--c-gold);
        }

        .layout-two-col .proto-card-title {
            font-family: var(--font-title);
            font-size: 25px;
            font-weight: 700;
            color: var(--c-dark);
            margin-bottom: 12px;
            padding-bottom: 9px;
            border-bottom: 1px solid rgba(205, 187, 160, 0.35);
            flex-shrink: 0;
        }

        .dark-theme .layout-two-col .proto-card-title {
            color: var(--c-sand);
            border-bottom-color: rgba(205, 187, 160, 0.2);
        }

        .layout-two-col .proto-card-desc {
            font-size: 16.5px;
            font-style: italic;
            color: var(--c-terra);
            margin-bottom: 16px;
            line-height: 1.48;
            flex-shrink: 0;
        }

        .dark-theme .layout-two-col .proto-card-desc {
            color: var(--c-gold);
        }

        .layout-two-col .proto-bullets {
            gap: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            margin: 0;
            padding: 0;
        }

        .layout-two-col .proto-bullets li {
            font-size: 18px;
            line-height: 1.52;
            padding-left: 24px;
            color: #2D2320;
            position: relative;
        }

        .dark-theme .layout-two-col .proto-bullets li {
            color: var(--c-linen);
        }

        .layout-two-col .proto-bullets li::before {
            font-size: 20px;
            top: -1px;
            left: 3px;
        }

        .layout-two-col .proto-bullets li strong {
            color: #1A120F;
            font-weight: 700;
        }

        .layout-two-col .proto-bullets li strong:first-of-type {
            color: var(--c-terra);
            font-weight: 750;
        }

        .dark-theme .layout-two-col .proto-bullets li strong {
            color: #FFFFFF;
            font-weight: 700;
        }

        .dark-theme .layout-two-col .proto-bullets li strong:first-of-type {
            color: var(--c-gold);
            font-weight: 750;
        }

        /* Layout: Curriculum Grid (Slide 02 Roadmap) */
        .layout-curriculum-root {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            min-height: 0;
            box-sizing: border-box;
        }

        .curriculum-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            flex: 1;
            min-height: 0;
            margin-bottom: 12px;
        }

        .curriculum-card {
            background: var(--c-card-bg);
            border-radius: 12px;
            border: 1px solid var(--c-border);
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .dark-theme .curriculum-card {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(205, 187, 160, 0.22);
        }

        .curriculum-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--card-accent, var(--c-terra));
        }

        .curriculum-card.mod-1 { --card-accent: #765535; }
        .curriculum-card.mod-2 { --card-accent: #8B906D; }
        .curriculum-card.mod-3 { --card-accent: #47342E; }
        .curriculum-card.mod-4 { --card-accent: #B94137; }

        .curr-badge-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .curr-mod-pill {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            background: var(--card-accent, #765535);
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .curr-count-pill {
            font-size: 11px;
            font-weight: 600;
            color: var(--card-accent, #765535);
            background: rgba(205, 187, 160, 0.25);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .curr-card-h {
            font-family: var(--font-title);
            font-size: 15px;
            font-weight: 700;
            color: var(--c-dark);
            margin-bottom: 8px;
            line-height: 1.25;
            min-height: 38px;
        }

        .dark-theme .curr-card-h {
            color: var(--c-sand);
        }

        .curr-topic-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow-y: auto;
        }

        .curr-topic-list li {
            font-size: 12px;
            color: var(--c-dark);
            line-height: 1.35;
            padding-left: 12px;
            position: relative;
        }

        .dark-theme .curr-topic-list li {
            color: var(--c-linen);
        }

        .curr-topic-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--card-accent, var(--c-terra));
            font-weight: bold;
        }

        /* Accreditation Strip */
        .curriculum-bottom-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--c-dark);
            color: var(--c-linen);
            padding: 10px 20px;
            border-radius: 10px;
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        .accred-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .accred-seal {
            background: var(--c-gold);
            color: var(--c-dark);
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        .accred-lead {
            font-family: var(--font-title);
            font-size: 15.5px;
            font-weight: 700;
            color: #fff;
        }

        .accred-metrics-chips {
            display: flex;
            gap: 16px;
        }

        .accred-chip {
            font-size: 12px;
            color: var(--c-sand);
        }

        .accred-chip strong {
            color: var(--c-gold);
            font-size: 14px;
            margin-right: 3px;
        }

        /* Layout: Three Cards */
        .layout-three-cards {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            height: 100%;
            min-height: 0;
            flex: 1;
        }

        /* Layout: Matrix 4 Quadrants */
        .layout-matrix-4 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 16px;
            height: 100%;
            min-height: 0;
            flex: 1;
        }

        /* Standard Cards - Title anchored at top, bullets centered in remainder */
        .proto-card {
            background: var(--c-card-bg);
            border: 1px solid var(--c-border);
            border-left: 5px solid var(--c-terra);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        .dark-theme .proto-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(205, 187, 160, 0.22);
            border-left: 5px solid var(--c-gold);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .proto-card-title {
            font-family: var(--font-title);
            font-size: 21px;
            font-weight: 700;
            color: var(--c-dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.25;
            flex-shrink: 0;
        }

        .dark-theme .proto-card-title {
            color: var(--c-sand);
        }

        .proto-card-desc {
            font-size: 15.5px;
            line-height: 1.45;
            color: #382F2B;
            margin-bottom: 6px;
        }

        .dark-theme .proto-card-desc {
            color: var(--c-linen);
        }

        .proto-bullets {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            justify-content: flex-start;
        }

        .proto-bullets li {
            font-size: 15.5px;
            line-height: 1.44;
            color: #382F2B;
            position: relative;
            padding-left: 18px;
        }

        .dark-theme .proto-bullets li {
            color: var(--c-linen);
        }

        .proto-bullets li::before {
            content: "•";
            position: absolute;
            left: 2px;
            top: -1px;
            color: var(--c-terra);
            font-weight: bold;
            font-size: 18px;
        }

        .dark-theme .proto-bullets li::before {
            color: var(--c-gold);
        }

        .proto-bullets li strong {
            color: var(--c-dark);
            font-weight: 600;
        }

        .dark-theme .proto-bullets li strong {
            color: var(--c-sand);
        }

        /* Metrics Strip */
        .metrics-strip {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .metric-badge {
            background: var(--c-linen);
            border: 1px solid var(--c-sand);
            border-radius: 9px;
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
            box-sizing: border-box;
        }

        .dark-theme .metric-badge {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(205, 187, 160, 0.3);
        }

        .metric-val {
            font-family: var(--font-title);
            font-size: 30px;
            font-weight: 700;
            color: var(--c-terra);
            line-height: 1.1;
        }

        .dark-theme .metric-val {
            color: var(--c-gold);
        }

        .metric-lbl {
            font-size: 12.5px;
            color: var(--c-olive);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
            margin-top: 2px;
        }

        .dark-theme .metric-lbl {
            color: rgba(240, 233, 215, 0.8);
        }

        /* Layout specific adjustments */
        .layout-three-cards .proto-card {
            padding: 18px 22px;
        }
        .layout-three-cards .proto-card-title {
            font-size: 20.5px;
            margin-bottom: 8px;
        }
        .layout-three-cards .proto-bullets {
            gap: 8px;
        }
        .layout-three-cards .proto-bullets li {
            font-size: 16px;
            line-height: 1.44;
        }

        .layout-matrix-4 .proto-card {
            padding: 14px 18px;
        }
        .layout-matrix-4 .proto-card-title {
            font-size: 19.5px;
            margin-bottom: 6px;
        }
        .layout-matrix-4 .proto-bullets {
            gap: 6px;
        }
        .layout-matrix-4 .proto-bullets li {
            font-size: 15.2px;
            line-height: 1.42;
        }

        /* Slide Footer */
        .slide-inner-footer {
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(71, 52, 46, 0.1);
            margin-top: 12px;
            padding-top: 8px;
        }

        .dark-theme .slide-inner-footer {
            border-top-color: rgba(205, 187, 160, 0.2);
        }

        .footer-values-strip {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--c-sand);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dark-theme .footer-values-strip {
            color: var(--c-sand);
        }

        .footer-values-strip .val-dot {
            color: var(--c-gold);
            font-size: 12px;
        }

        .footer-meta-strip {
            font-size: 11px;
            color: var(--c-text-muted);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .dark-theme .footer-meta-strip {
            color: rgba(205, 187, 160, 0.7);
        }

        .footer-slide-num {
            font-weight: 700;
            color: var(--c-terra);
            font-size: 12px;
        }

        .dark-theme .footer-slide-num {
            color: var(--c-gold);
        }

        /* Presenter Drawer */
        .presenter-panel {
            position: fixed;
            bottom: 50px;
            right: 20px;
            width: 480px;
            max-height: 70vh;
            background: #2B211E;
            color: var(--c-linen);
            border: 1px solid var(--c-sand);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            z-index: 500;
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .presenter-panel.open {
            display: flex;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .presenter-header {
            padding: 14px 18px;
            background: #211917;
            border-bottom: 1px solid rgba(205, 187, 160, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .presenter-header h3 {
            font-family: var(--font-title);
            font-size: 14px;
            color: var(--c-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-close-notes {
            background: none;
            border: none;
            color: var(--c-sand);
            font-size: 18px;
            cursor: pointer;
        }

        .presenter-body {
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-size: 12.5px;
            line-height: 1.6;
        }

        .note-box {
            background: rgba(255, 255, 255, 0.04);
            border-left: 3px solid var(--c-sand);
            padding: 10px 14px;
            border-radius: 0 6px 6px 0;
        }

        .note-box.warning {
            border-left-color: #D96B43;
            background: rgba(217, 107, 67, 0.08);
        }

        .note-box.question {
            border-left-color: var(--c-gold);
            background: rgba(209, 174, 102, 0.08);
        }

        .note-box-title {
            font-weight: 600;
            color: var(--c-sand);
            margin-bottom: 4px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .note-box.warning .note-box-title {
            color: #E28867;
        }

        .note-box.question .note-box-title {
            color: var(--c-gold);
        }

        /* Grid View */
        .grid-modal {
            position: fixed;
            top: 54px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 54px);
            background: rgba(20, 15, 13, 0.95);
            backdrop-filter: blur(8px);
            z-index: 800;
            display: none;
            padding: 40px;
            overflow-y: auto;
        }

        .grid-modal.open {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--c-bg);
            border-radius: 8px;
            aspect-ratio: 16 / 9;
            padding: 14px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .thumb-card:hover {
            border-color: var(--c-sand);
            transform: translateY(-4px);
        }

        .thumb-card.active {
            border-color: var(--c-gold);
            box-shadow: 0 0 15px rgba(209, 174, 102, 0.5);
        }

        .thumb-card.dark {
            background: var(--c-dark);
            color: var(--c-linen);
        }

        .thumb-num {
            font-size: 11px;
            font-weight: bold;
            color: var(--c-terra);
        }

        .thumb-card.dark .thumb-num {
            color: var(--c-sand);
        }

        .thumb-title {
            font-family: var(--font-title);
            font-size: 11.5px;
            font-weight: bold;
            line-height: 1.3;
        }

        .thumb-cat {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--c-text-muted);
            letter-spacing: 0.5px;
        }

        .thumb-card.dark .thumb-cat {
            color: rgba(205, 187, 160, 0.7);
        }

        /* Bottom Floating Bar */
        .bottom-bar {
            height: 48px;
            background: #241C1A;
            color: var(--c-linen);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            font-size: 11px;
            border-top: 1px solid rgba(205, 187, 160, 0.15);
        }

        .keyboard-shortcuts {
            display: flex;
            gap: 16px;
            color: var(--c-sand);
        }

        .kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-right: 4px;
            color: #FFF;
        }

        /* Print / PDF Styles */
        @media print {
            body {
                background: none !important;
                color: #000 !important;
                height: auto !important;
                overflow: visible !important;
            }

            .top-navbar, .bottom-bar, .presenter-panel, .grid-modal, .progress-container {
                display: none !important;
            }

            @page {
                size: 1600px 900px landscape;
                margin: 0;
            }

            .stage-wrapper {
                padding: 0 !important;
                display: block !important;
                height: 900px !important;
                width: 1600px !important;
            }

            .slide-deck-scaler {
                width: 1600px !important;
                height: 900px !important;
                --slide-scale: 1 !important;
            }

            .slide-deck-frame {
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                transform: none !important;
                width: 1600px !important;
                height: 900px !important;
                max-height: none !important;
                aspect-ratio: 16 / 9 !important;
                page-break-after: always !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
            }
        }
    </style>
</head>

 profesionalne nege i razvoja deteta", "title_styled": "Standardi <em>profesionalne nege</em> i razvoja deteta"}, {"badge": "STRUKTURA KURIKULUMA", "bg_theme": "light", "category": "PREGLED PROGRAMA", "content_blocks": [{"bullets": ["<strong>Modul 1 (8 tema):</strong> Higijena i nega novorođenčeta – <strong>soba, kupanje, pupčanik, toaleta čula i garderoba</strong>.", "<strong>Modul 2 (10 tema):</strong> Dojenje – <strong>asimetrični hvat, let-down, prevencija ragada i mastitisa, izmazanje i formula (70°C)</strong>.", "<strong>Modul 3 (6 tema):</strong> Nega odojčeta – <strong>kalendar imunizacije, šetnja u kolicima, uvođenje hrane (pravilo 3 dana) i auto-sedište</strong>.", "<strong>Modul 4 (13 tema):</strong> Bolesno dete i hitna stanja – <strong>kolike, febrilnost, gušenje, padovi, alergije, apoteka i lekovi</strong>."], "text": "Program vodi polaznice kroz sve faze dečjeg rasta – od prvog susreta sa novorođenčetom do složenih hitnih protokola kod bolesnog deteta.", "title": "4 stuba medicinske i pedijatrijske obuke"}, {"bullets": ["<strong>Klinička preciznost:</strong> Usvajanje egzaktnih parametara (<strong>temperature, satnice, mililitri i granične vrednosti</strong>).", "<strong>Praktičan rad (hands-on):</strong> <strong>Savladavanje motorike na trenažnim lutkama</strong> pre prvog ulaska u porodicu.", "<strong>Krizni protokoli:</strong> Uvežbavanje <strong>hitne reakcije u vanrednim situacijama bez panike</strong>."], "text": "Edukacija je zasnovana na tri pedagoška principa koji garantuju apsolutnu sigurnost polaznica u radu sa porodicama.", "title": "Metodologija rada i pedagoški standard"}], "curriculum_modules": [{"badge": "8 TEMA", "color": "#765535", "mod_id": "MODUL 1", "title": "Higijena i nega novorođenčeta", "topics": ["Priprema sobe i mikroklima", "Kupanje bebe i nega kože", "Nega pupčanika i pupčane rane", "Nega čula (oči, uši, nos, nokti)", "Oblačenje i prevencija pretopljavanja", "Položaji pri hranjenju, nošenju i snu", "Higijena bebine garderobe i opreme"]}, {"badge": "10 TEMA", "color": "#8B906D", "mod_id": "MODUL 2", "title": "Dojenje i ishrana novorođenčeta", "topics": ["Prednosti dojenja i biološki značaj", "Higijena dojki i nega lanolinom", "Priprema dojki i let-down refleks", "Položaji pri dojenju i ergonomija", "Asimetrični hvat bradavice", "Ispucale bradavice (ragade)", "Prepunjenost dojki i mastitis", "Tehnike izmazanja majčinog mleka", "Čuvanje i odmrzavanje mleka", "Priprema adaptirane formule (70°C)"]}, {"badge": "6 TEMA", "color": "#47342E", "mod_id": "MODUL 3", "title": "Nega i razvoj odojčeta", "topics": ["Kalendar obavezne imunizacije", "Šetnja i boravak na svežem vazduhu", "Uvođenje čvrste hrane (pravilo 3 dana)", "Zdrave navike i motorni razvoj", "Nicanje zubića i oralna toaleta", "Putovanje i bezbednost u vožnji"]}, {"badge": "13 TEMA", "color": "#B94137", "mod_id": "MODUL 4", "title": "Bolesno dete i hitna stanja", "topics": ["Grčevi (kolike) i smirivanje", "Osipi po telu i pelenski osip", "Infekcije oka i zapušen nos", "Postvakcinalne reakcije i nega", "Digestivni poremećaji i dehidracija", "Visoka febrilnost i konvulzije", "Gušenje, padovi i opekotine", "Zarazne bolesti dečjeg uzrasta", "Ujedi insekata i vađenje krpelja", "Alergije i anafilaktički šok", "Putna i kućna apoteka za decu", "Davanje lekova i etički kodeks"]}], "id": 2, "image": "slide02_curriculum_structure.png", "layout": "curriculum_grid", "lecturer_notes": {"cilj": "Predstaviti polaznicama celokupnu mapu edukacije i povezati sve teme u jedinstven logički sistem.", "greske": "Pretpostavka da se bolesno dete neguje intuitivno, bez poznavanja egzaktnih protokola i crvenih alarma.", "pitanje": "Koju oblast pedijatrijske nege smatrate najodgovornijom i u kojoj osećate potrebu za najvećim usavršavanjem?", "teze": "Objasnite polaznicama da svaka od 37 tema ima direktnu primenu u praksi. Redosled je osmišljen tako da se znanje postepeno nadograđuje."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Stručna modula", "val": "4"}, {"lbl": "Zasebnih tema", "val": "37"}, {"lbl": "Verifikacija znanja", "val": "100%"}], "module": "Uvod", "subtitle": "4 stručna modula • 37 pedijatrijskih i kliničkih tema • Praktična obuka", "title": "Struktura edukativnog programa i kurikuluma", "title_styled": "Struktura edukativnog <em>programa i kurikuluma</em>"}, {"badge": "OKRUŽENJE I OPREMA", "bg_theme": "light", "category": "MODUL 1 • TEMA 1", "content_blocks": [{"bullets": ["<strong>Optimalna temperatura:</strong> Održavati <strong>18–23°C</strong> tokom dana i noći, a prilikom kupanja zagrejati na <strong>24–26°C</strong>.", "<strong>Vlažnost i provetravanje:</strong> Zimi redovno vlažiti zagrejani vazduh (<strong>50–60%</strong>); provetravati sobu <strong>više puta dnevno</strong> dok beba nije u njoj.", "<strong>Zidovi i enterijer:</strong> Nežne pastelne boje, svetla soba <strong>bez tepiha sa dugim vlaknima</strong> i predmeta koji skupljaju prašinu."], "text": "Prostor za bebu mora biti oaza čistoće, mira i optimalnih mikroklimatskih parametara koji podržavaju nezreo termoregulacioni centar novorođenčeta.", "title": "Mikroklima i higijena prostora"}, {"bullets": ["<strong>Pozicija kreveca:</strong> U mirnom uglu, <strong>dalje od promaje i prozora</strong>, minimum <strong>1–1.5 metar od radijatora</strong> i strujnih utičnica.", "<strong>Čvrst dušek:</strong> Ravan i tvrd dušek <strong>bez jastuka i debelih ogradica</strong>; posteljina od <strong>100% prirodnog pamuka</strong>.", "<strong>Kutak za prepovijanje i dojenje:</strong> Komoda sa mekom podlogom <strong>na dohvat ruke sa pelenama i kremama</strong>; udobna fotelja za dojenje."], "text": "Ergonomski raspored omogućava dadilji i majci da sve radnje obavljaju bezbedno i bez nepotrebnog savijanja kičme.", "title": "Bezbednost kreveca i raspored opreme"}], "id": 3, "image": "slide04_nursery_cot.jpg", "layout": "split_right_image", "lecturer_notes": {"cilj": "Naučiti polaznice kako da pripreme i bezbednosno verifikuju prostoriju i opremu pre dolaska novorođenčeta.", "greske": "Pretopljavanje sobe preko 24°C, postavljanje kreveca tik uz radijator ili ispod prozora, i pretrpavanje kreveca plišanim igračkama.", "pitanje": "Zašto je preporučljivo da ogradica ne zatvara sve 4 strane kreveca novorođenčeta?", "teze": "Bebi je neophodna nesmetana cirkulacija svežeg vazduha. Naglasiti važnost vlaženja vazduha zimi jer suv vazduh isušuje sluzokožu disajnih puteva."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Sobna temperatura", "val": "18-23°C"}, {"lbl": "Od izvora toplote", "val": "1.5 m"}, {"lbl": "Vlažnost vazduha", "val": "50-60%"}], "module": "Modul 1: Higijena i nega", "subtitle": "Modul 1: Higijena i nega novorođenčeta • Tema 1", "title": "Priprema sobe za bebu, nameštaja i opreme", "title_styled": "Priprema sobe za bebu, <em>nameštaja i opreme</em>"}, {"badge": "STANICA ZA KUPANJE", "bg_theme": "light", "category": "MODUL 1 • TEMA 2", "content_blocks": [{"bullets": ["<strong>Zagrevanje prostorije:</strong> Provetriti prostoriju, a zatim je zagrejati na <strong>24–26°C</strong> kako beba ne bi doživela <strong>temperaturni šok</strong>.", "<strong>Provera vode toplomerom:</strong> Voda u kadici mora biti <strong>35–37°C</strong>; obavezno proveriti <strong>namenskim toplomerom</strong> ili <strong>unutrašnjom stranom podlaktice</strong>.", "<strong>Pripremljen bokal za ispiranje:</strong> Bokal sa <strong>čistom toplom vodom</strong> pripremiti pored kadice za <strong>završno polivanje tela</strong>."], "text": "Kupanje je intiman i smirujući ritual koji zahteva savršenu logističku pripremu pre nego što se sa bebe skine ijedan komad odeće.", "title": "Priprema prostora i mikroklima"}, {"bullets": ["<strong>Kompletan set za toaletu:</strong> Kadica, <strong>meki frotirni peškir sa kapuljačom</strong>, rukavica za kupanje, <strong>sindet pH 5.5</strong>, sterilne gaze i fiziološki rastvor.", "<strong>Pripremljena garderoba:</strong> Čist bodi, zeka, <strong>pelena i krema za pelensku regiju</strong> već <strong>otvoreni na stolu za prepovijanje</strong>.", "<strong>Zlatno pravilo bezbednosti:</strong> Beba se <strong>NIKADA ne ostavlja sama</strong> u kadici ili na komodi ni na pola sekunde; <strong>jedna ruka uvek čvrsto pridržava bebu</strong>."], "text": "Svi rekviziti i garderoba moraju biti raspoređeni po tačnom redosledu upotrebe pre početka toalete.", "title": "Sve na dohvat ruke PRE svlačenja"}], "id": 4, "image": "slide05_bath_prep_station.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti protokol organizacije stanice za kupanje gde se eliminiše svaki bezbednosni rizik.", "greske": "Svlačenje bebe pre nego što je sipana voda ili pre nego što su pripremljeni peškir i čista odeća, što stvara paniku i rizik od pothlađivanja.", "pitanje": "Zašto se temperatura vode uvek mora meriti toplomerom, a ne samo procenjivati dlanom?", "teze": "Dlan odrasle osobe je ogrubeo i manje osetljiv. Koža novorođenčeta je višestruko tanja i sklona opekotinama već na temperaturama preko 38°C."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Temperatura vode", "val": "35-37°C"}, {"lbl": "Temperatura sobe", "val": "24-26°C"}, {"lbl": "Stalni nadzor", "val": "100%"}], "module": "Modul 1: Higijena i nega", "subtitle": "Modul 1: Higijena i nega novorođenčeta • Tema 2", "title": "Kupanje bebe: Priprema, stanica i mikroklima", "title_styled": "Kupanje bebe: <em>Priprema, stanica i mikroklima</em>"}, {"badge": "TEHNIKA I DERMATOLOGIJA", "bg_theme": "light", "category": "MODUL 1 • TEMA 3", "content_blocks": [{"bullets": ["<strong>Kupanje preko ruke (do mesec dana):</strong> Ruka ispod bebinog grudnog koša; preko pupčanog patrljka stavlja se <strong>suva tetra pelena</strong>; pere se prvo glava, trup, pa noge.", "<strong>Kupanje u kadici (sa kupkom):</strong> Beba leži na leđima sa glavicom <strong>podignutom 5 cm iznad vode</strong> na majčinoj podlaktici; lagano spuštanje prvo nožicama u vodu.", "<strong>Redosled pranja:</strong> Lice, glava, trup, ekstremiteti, a <strong>genitalna regija uvek poslednja</strong>; temeljno ispiranje vodom iz bokala."], "text": "Tehnika kupanja se prilagođava stanju pupčane rane, uz stabilan hvat koji bebi pruža osećaj sigurnosti.", "title": "Dve tehnike kupanja novorođenčeta"}, {"bullets": ["<strong>Sindeti umesto klasičnih sapuna:</strong> Koristiti <strong>blage sindete (pH 5.5)</strong> koji čuvaju zaštitni <strong>hidrolipidni omotač kože</strong>.", "<strong>Sušenje tapkanjem:</strong> Umotati bebu u mekani pamučni frotir; sušiti <strong>nežnim tapkanjem bez grubog trljanja</strong>, posebno u prevojima vrata i prepona.", "<strong>Pravilo 3 minuta:</strong> Naneti <strong>emolijens na blago vlažnu kožu unutar 3 minuta</strong> od kupanja radi optimalnog zadržavanja vlage."], "text": "Koža novorođenčeta je pet puta tanja od kože odrasle osobe i sklona je brzom isušivanju i iritacijama.", "title": "Zlatni standardi dermatološke nege kože"}], "id": 5, "image": "slide06_baby_bath.jpg", "layout": "split_right_image", "lecturer_notes": {"cilj": "Savladati biomehaniku sigurnog držanja bebe tokom kupanja i pravilan izbor dermatoloških preparata.", "greske": "Trljanje kože peškirom, pranje bebinog lica sapunicom, i korišćenje alkalnih sapuna koji uništavaju pH barijeru kože.", "pitanje": "Zašto se glava i kosa novorođenčeta moraju dobro isprati i blago prosušiti kružnim pokretima frotira?", "teze": "Zadržavanje neispranog šampona i mrtvih ćelija na temenu podstiče stvaranje temenjače (seboreičnog dermatitisa). Redovna toaleta glave to sprečava."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Trajanje kupanja", "val": "5-10 min"}, {"lbl": "Sindet sapun", "val": "pH 5.5"}, {"lbl": "Pravilo hidratacije", "val": "3 min"}], "module": "Modul 1: Higijena i nega", "subtitle": "Modul 1: Higijena i nega novorođenčeta • Tema 3", "title": "Tehnika kupanja bebe i nega kože", "title_styled": "Tehnika kupanja bebe i <em>nega kože</em>"}, {"badge": "KLINIČKI PROTOKOL", "bg_theme": "light", "category": "MODUL 1 • TEMA 4", "content_blocks": [{"bullets": ["<strong>Prirodna mumifikacija:</strong> Pupčani patrljak se suši i spontano otpada između <strong>7. i 14. dana</strong>; proces se odvija brže ako se održava <strong>suvim i čistim</strong>.", "<strong>Toaleta antiseptikom:</strong> Prskanje <strong>Octenisept sprejom 1–2 puta dnevno</strong> i kod svakog prepovijanja ako dođe u kontakt sa urinom.", "<strong>Pravilno prepovijanje:</strong> Prednji rub jednokratne pelene <strong>obavezno saviti ka spolja ispod pupka</strong> kako bi rana bila na vazduhu i zaštićena od vlage."], "text": "Savremeni pedijatrijski protokol nalaže princip suve nege koja omogućava brzu i bezbednu mumifikaciju pupčanog patrljka.", "title": "Zlatni standard suve nege pupčanika"}, {"bullets": ["<strong>Crveni alarmi za hitan pregled:</strong> <strong>Crvenilo oko pupka prečnika većeg od 1 cm</strong>, otok, <strong>neprijatan truležni miris</strong>, žućkast gnojan sekret.", "<strong>Pupčani granulom:</strong> Crvenkasta mesnata izraslina u dnu rane nakon otpadanja koja vlaži – <strong>zahteva lapiziranje kod pedijatra</strong>.", "<strong>Stroge zabrane:</strong> <strong>NIKADA ne vući i ne čupati patrljak na silu</strong>; <strong>zabranjeno posipanje antibiotskih praškova</strong> i mazanje narodnih melema."], "text": "Svako odstupanje od normalnog zarastanja zahteva hitnu medicinsku evaluaciju radi sprečavanja širenja infekcije.", "title": "Prepoznavanje komplikacija (Omfalitis)"}], "id": 6, "image": "slide08_umbilical_cord_care.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Ovladati sterilnom tehnikom nege pupčanog patrljka i ranim prepoznavanjem omfalitisa.", "greske": "Prekrivanje pupka pelenom gde urin vlaži ranu, ili nasilno povlačenje patrljka koji još nije potpuno mumifikovao.", "pitanje": "Šta treba uraditi ako se nakon otpadanja patrljka na sterilnoj gazi pojavi kapljica sveže sasušene krvi?", "teze": "Minimalna kap krvi prilikom otpadanja je normalna reakcija rupture kapilara. Rana se prebriše Octeniseptom i prekrije sterilnom gazom. Ako krvarenje pulsira ili ne prestaje, obavezan je pregled lekara."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Otpadanje patrljka", "val": "7-14 dana"}, {"lbl": "Izbor antiseptika", "val": "Octenisept"}, {"lbl": "Zlatni standard", "val": "Suva nega"}], "module": "Modul 1: Higijena i nega", "subtitle": "Modul 1: Higijena i nega novorođenčeta • Tema 4", "title": "Nega pupčanika i pupčane rane", "title_styled": "Nega pupčanika i <em>pupčane rane</em>"}, {"badge": "TOALETA ČULA", "bg_theme": "light", "category": "MODUL 1 • TEMA 5", "content_blocks": [{"bullets": ["<strong>Brisanje očiju:</strong> Sterilna gaza natopljena <strong>fiziološkim rastvorom (0.9% NaCl)</strong>; brisati uvek <strong>od spoljašnjeg ugla oka ka unutrašnjem (ka nosu)</strong>.", "<strong>Zlatno pravilo za oči:</strong> Za svako oko i za svaki potez koristi se <strong>nova sterilna gaza</strong>! <strong>Nikada ne vraćati gazu unazad</strong>.", "<strong>Zabrana kamilice:</strong> Čaj od kamilice je <strong>STROGO ZABRANJEN</strong> jer nije sterilan, sadrži spore plesni i polen koji izazivaju <strong>teške konjunktivitise</strong>.", "<strong>Toaleta nosića:</strong> Nakapati <strong>1–2 kapi fiziološkog rastvora</strong> dok beba leži na boku radi razmekšavanja sekreta; aspirirati samo ako sekret ometa disanje."], "text": "Čula novorođenčeta su izuzetno osetljiva i zahtevaju upotrebu sterilnih materijala bez ikakvih agresivnih ili alergogenih supstanci.", "title": "Sterilna toaleta očiju i nosa"}, {"bullets": ["<strong>Uši bez štapića:</strong> Brisati <strong>samo spoljašnju ušnu školjku</strong> i prevoj iza uha vlažnim tupferom; <strong>štapići za uši su STROGO ZABRANJENI u kanalu</strong>.", "<strong>Noktići u prvim nedeljama:</strong> U prve 2–3 nedelje se ne seku jer su srasli sa jagodicom; po potrebi staviti <strong>pamučne rukavice</strong> radi zaštite od grebanja.", "<strong>Pravilno sečenje:</strong> Koristiti <strong>makazice sa zaobljenim tupim vrhom</strong> dok beba mirno spava; nokte seći <strong>ravno, nikada u krug</strong>, radi prevencije urastanja."], "text": "Pravilna nega ušiju i noktića sprečava povrede nežne sluzokože i samopovređivanje lica.", "title": "Toaleta ušiju i sečenje noktića"}], "id": 7, "image": "slide07_sensory_care.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti precizne aseptične korake toalete oka, nosa, uha i noktiju bez improvizacija.", "greske": "Upotreba čaja od kamilice za ispiranje očiju i guranje štapića sa vatom u ušni kanal odojčeta.", "pitanje": "Zašto se brisanje oka novorođenčeta vrši od spoljašnjeg ugla ka unutrašnjem, a ne obrnuto?", "teze": "Kretanjem ka nosu sekret se usmerava prirodnim tokom ka suznom kanalu i sprečava širenje eventualne infekcije ka očnoj jabučici i spoljnoj regiji."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Fiziološki rastvor", "val": "0.9% NaCl"}, {"lbl": "Jedna gaza po oku", "val": "Jedan potez"}, {"lbl": "U ušni kanal", "val": "0 štapića"}], "module": "Modul 1: Higijena i nega", "subtitle": "Modul 1: Higijena i nega novorođenčeta • Tema 5", "title": "Nega čula: Oči, uši, nos i noktići", "title_styled": "Nega čula: <em>Oči, uši, nos i noktići</em>"}, {"badge": "TERMOREGULACIJA", "bg_theme": "light", "category": "MODUL 1 • TEMA 6", "content_blocks": [{"bullets": ["<strong>100% organski pamuk:</strong> Odeća mora biti od <strong>čistog, prirodnog, prozračnog pamuka</strong> bez sintetike, perlica i unutrašnjih grubih etiketa.", "<strong>Praktični krojevi:</strong> <strong>Bodići sa preklopom na grudima (na dugmiće)</strong> koji se ne navlače preko glave idealni su za prve nedelje nege.", "<strong>Svetli i pastelni tonovi:</strong> Beli i svetli tonovi omogućavaju <strong>pranje na visokim temperaturama (60–90°C)</strong> i brzo uočavanje eventualnih promena na bebi."], "text": "Novorođenče ima nezreo centar za termoregulaciju, veliku površinu tela u odnosu na masu i tanku kožu, zbog čega lako gubi, ali i akumulira toplotu.", "title": "Pravilan odabir odeće i materijala"}, {"bullets": ["<strong>Pravilo jednog sloja više:</strong> Uobičajeni standard je <strong>onoliko slojeva koliko ima odrasla osoba plus jedan tanak pamučni sloj</strong> (bodić + zeka).", "<strong>Gde se proverava temperatura:</strong> Pipati <strong>bebin potiljak, vrat ili grudni koš</strong>; koža treba da bude topla i suva. Šake i stopala su fiziološki hladniji.", "<strong>Opasnosti pretopljavanja:</strong> Vodi u <strong>dehidraciju, toplotni osip (miliaria), nervozu</strong> i predstavlja jedan od faktora rizika za <strong>SIDS</strong>."], "text": "Slojevito oblačenje omogućava brzu regulaciju temperature u skladu sa promenama u prostoru.", "title": "Pravilo slojevitosti i provera toplote"}], "id": 8, "image": "slide08_baby_dressing.jpg", "layout": "split_right_image", "lecturer_notes": {"cilj": "Naučiti polaznice proceni toplotnog komfora deteta i prevenciji pretopljavanja.", "greske": "Oblačenje kape bebi u zagrejanoj sobi, višestruko umotavanje u ćebad i procena toplote po hladnim bebinim šakama.", "pitanje": "Zašto hladne šake i stopala kod novorođenčeta nisu pouzdan znak da je bebi hladno?", "teze": "Periferna cirkulacija kod novorođenčeta je u razvoju i vazomotorne reakcije na periferiji su izražene. Merodavan je isključivo potiljak – ako je znojav, beba je pretopljena."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Organski pamuk", "val": "100%"}, {"lbl": "Pravilo u odnosu na odrasle", "val": "+1 sloj"}, {"lbl": "Mesto provere toplote", "val": "Potiljak"}], "module": "Modul 1: Higijena i nega", "subtitle": "Modul 1: Higijena i nega novorođenčeta • Tema 6", "title": "Oblačenje bebe i prevencija pretopljavanja", "title_styled": "Oblačenje bebe i <em>prevencija pretopljavanja</em>"}, {"badge": "ERGONOMIJA I BEZBEDNOST", "bg_theme": "light", "category": "MODUL 1 • TEMA 7", "content_blocks": [{"bullets": ["<strong>Ugao pri hranjenju:</strong> <strong>Polusedeći položaj pod uglom 30–45°</strong>; glava u ravni tela, usta i nosić slobodni za nesmetano disanje.", "<strong>Ergonomsko nošenje:</strong> Podrška za glavicu i vrat; kičma u prirodnoj <strong>\"C\" zakrivljenosti</strong>, karlica u <strong>\"M\" položaju (žabica)</strong>.", "<strong>Tehnike podrigivanja:</strong> Nakon obroka držati bebu <strong>uspravno preko ramena</strong>, na krilu sa osloncem pod bradu, ili <strong>preko kolena uz blago tapkanje</strong>."], "text": "Pravilni položaji rasterećuju digestivni trakt novorođenčeta, smanjuju gutanje vazduha i sprečavaju regurgitaciju.", "title": "Biomehanika hranjenja, nošenja i podrigivanja"}, {"bullets": ["<strong>Alone (Sama):</strong> Beba spava u svom krevecu u sobi roditelja/dadilje, <strong>bez deljenja postelje</strong> (prevencija pritiskanja i gušenja).", "<strong>Back (Na leđima):</strong> <strong>ISKLJUČIVO na leđima</strong> na ravnom čvrstom dušeku; spavanje na stomaku ili boku je <strong>strogo zabranjeno u prvoj godini</strong>.", "<strong>Crib (Prazan krevetac):</strong> <strong>Nema jastuka, debelih jorgana, plišanih igračaka ili ogradica</strong> koji mogu izazvati asfiksiju.", "<strong>Rotacija glavice:</strong> Okretati bebinu glavu <strong>naizmenično na levu i desnu stranu</strong> pri svakom spavanju radi prevencije zaravnjenja potiljka."], "text": "Međunarodni pedijatrijski protokol za bezbedno spavanje dramatično redukuje rizik od sindroma iznenadne smrti odojčeta.", "title": "ABC bezbedan san (Prevencija SIDS-a)"}], "id": 9, "image": "slide11_safe_sleep_carrying.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti međunarodne standarde bezbednog sna (AAP protokoli) i pravilne tehnike nošenja i hranjenja.", "greske": "Uspavljivanje novorođenčeta na stomaku ili boku, postavljanje mekih jastuka pod glavu i preskakanje podrigivanja.", "pitanje": "Zašto se spavanje na boku više ne preporučuje kao bezbedan položaj za novorođenče?", "teze": "Beba u bočnom položaju lako može da se prevali na stomak, što drastično uvećava rizik od blokade disajnih puteva i sindroma iznenadne smrti odojčeta (SIDS)."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Ugao pri hranjenju", "val": "30-45°"}, {"lbl": "Zlatni standard sna", "val": "ABC"}, {"lbl": "Jedini položaj sna", "val": "Leđa"}], "module": "Modul 1: Higijena i nega", "subtitle": "Modul 1: Higijena i nega novorođenčeta • Tema 7", "title": "Položaj pri hranjenju, nošenju i spavanju", "title_styled": "Položaj pri hranjenju, <em>nošenju i spavanju</em>"}, {"badge": "HIGIJENA I DEZINFEKCIJA", "bg_theme": "light", "category": "MODUL 1 • TEMA 8", "content_blocks": [{"bullets": ["<strong>Pranje pre prvog nošenja:</strong> Svaki novi odevni komad i posteljina <strong>moraju se oprati i ispeglati pre prvog kontakta sa bebinom kožom</strong>.", "<strong>Izbor deterdženta:</strong> Koristiti isključivo <strong>dermatološki testirane tečne deterdžente za bebe (sensitive)</strong>, bez optičkih izbeljivača i fosfata.", "<strong>Dvostruko ispiranje (Double Rinse):</strong> <strong>Obavezno uključiti dodatni ciklus ispiranja</strong> kako bi se eliminisao i najmanji trag deterdženta iz vlakana.", "<strong>STROGA ZABRANA OMEKŠIVAČA:</strong> Omekšivači su <strong>STROGO ZABRANJENI</strong> jer ostavljaju hemijski film, izazivaju <strong>kontaktne alergije</strong> i uništavaju pamuk."], "text": "Održavanje higijene tekstila sprečava kontaktne alergije, iritaciju kože i prenošenje patogena iz spoljašnje sredine.", "title": "Pravilno pranje i nega bebine garderobe"}, {"bullets": ["<strong>Peglanje sa parom:</strong> U prvim mesecima peglati veš <strong>vrelom parom sa obe strane</strong> radi uništavanja rezistentnih bakterija i gljivica.", "<strong>Sterilizacija flašica i cucli:</strong> <strong>Kuvanje u ključaloj vodi 5–10 minuta</strong> ili upotreba <strong>parnog sterilizatora</strong> nakon svakog hranjenja.", "<strong>Održavanje pumpica:</strong> Rastaviti sve delove, <strong>oprati toplom vodom i namenskim deterdžentom</strong>, zatim sterilisati pre sledeće upotrebe."], "text": "Termička obrada tekstila i sterilizacija pribora za hranjenje obavezni su standardi u prvim mesecima života.", "title": "Peglanje parom i sterilizacija pribora"}], "id": 10, "image": "slide10_wardrobe_hygiene.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Naučiti standarde hemijske i mikrobiološke bezbednosti tekstila i opreme sa kojom beba dolazi u kontakt.", "greske": "Korišćenje mirišljavih omekšivača za veš, zajedničko pranje bebinog veša sa odećom odraslih i nedovoljno ispiranje.", "pitanje": "Zašto se omekšivač za veš strogo zabranjuje u održavanju odeće novorođenčadi i odojčadi?", "teze": "Omekšivači sadrže jake sintetičke mirise i katjonske surfaktante koji stvaraju okluzivni sloj na tkanini, provociraju atopijski dermatitis i narušavaju disanje kože."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Temperatura pranja", "val": "60-90°C"}, {"lbl": "Ispiranje veša", "val": "2x"}, {"lbl": "Omekšivača za veš", "val": "0%"}], "module": "Modul 1: Higijena i nega", "subtitle": "Modul 1: Higijena i nega novorođenčeta • Tema 8", "title": "Higijena bebine garderobe i bebinog pribora", "title_styled": "Higijena bebine garderobe i <em>bebinog pribora</em>"}, {"badge": "ZLATNI STANDARD ISHRANE", "bg_theme": "light", "category": "MODUL 2 • TEMA 9", "content_blocks": [{"bullets": ["<strong>Kolostrum (\"tečno zlato\"):</strong> Prvo gusto žuto mleko bogato <strong>sekretornim IgA antitelima</strong>; deluje kao <strong>prva prirodna vakcina</strong>.", "<strong>Zrelo mleko:</strong> Sadrži idealan odnos <strong>vode, proteina, laktoze i esencijalnih masti (DHA/ARA)</strong> neophodnih za razvoj mozga i mrežnjače.", "<strong>Imunološki štit:</strong> Dokazano smanjuje rizik od <strong>respiratornih infekcija, stomačnih virusa, ekcema, dijabetesa i SIDS-a</strong>."], "text": "Majčino mleko je dinamična, živa biološka tečnost čiji se sastav menja u zavisnosti od uzrasta deteta, doba dana, pa čak i tokom jednog podoja.", "title": "Biološko savršenstvo majčinog mleka"}, {"bullets": ["<strong>Involucija materice:</strong> Sisanje stimuliše <strong>lučenje oksitocina</strong>, što ubrzava skupljanje materice i smanjuje postporođajno krvarenje.", "<strong>Onkološka zaštita:</strong> Dugoročno dojenje dokazano <strong>smanjuje rizik od karcinoma dojke i jajnika</strong> kod majke.", "<strong>Povezivanje i smirenje:</strong> <strong>Kontakt koža na kožu</strong> i dojenje podstiču lučenje endorfina i stvaraju <strong>neraskidivu emotivnu vezu</strong>."], "text": "Laktacija pokreće kaskadu neuroendokrinih procesa koji štite zdravlje majke i podržavaju psihički oporavak.", "title": "Zdravstvene i emotivne prednosti za majku"}], "id": 11, "image": "slide11_breastfeeding_benefits.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Pružiti polaznicama duboko naučno razumevanje bioloških prednosti majčinog mleka kako bi pružile nepokolebljivu podršku majkama.", "greske": "Pretpostavka da majka u prvim danima \"nema mleka\" jer kolostrum izlazi u kapima (zanemarivanje činjenice da je želudac novorođenčeta veličine klikera).", "pitanje": "Zašto se kolostrum naziva prvom bebinom vakcinom?", "teze": "Kolostrum sadrži ekstremno visoku koncentraciju sIgA antitela koja oblažu nezrelu sluzokožu bebinog digestivnog trakta i sprečavaju kolonizaciju patogena."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Sekretorna antitela", "val": "IgA"}, {"lbl": "Ekskluzivno dojenje", "val": "6 meseci"}, {"lbl": "Prirodna adaptacija", "val": "100%"}], "module": "Modul 2: Dojenje", "subtitle": "Modul 2: Dojenje • Tema 9", "title": "Prednosti dojenja i biološki značaj mleka", "title_styled": "Prednosti dojenja i <em>biološki značaj mleka</em>"}, {"badge": "HIGIJENA DOJENJA", "bg_theme": "light", "category": "MODUL 2 • TEMA 10", "content_blocks": [{"bullets": ["<strong>Pranje isključivo mlakom vodom:</strong> Dojke se peru <strong>isključivo čistom mlakom vodom jednom dnevno</strong> tokom redovnog tuširanja.", "<strong>STROGA ZABRANA SAPUNA I ALKOHOLA:</strong> Sapun, alkohol i dezinficijensi su <strong>STROGO ZABRANJENI</strong> jer skidaju prirodni zaštitni lipidni sloj i izazivaju bolne pukotine.", "<strong>Prirodni miris areole:</strong> <strong>Montgomerijeve žlezde</strong> luče sekret koji prirodno dezinfikuje areolu i svojim mirisom <strong>usmerava bebu ka dojci</strong>."], "text": "Prirodna fiziologija areole obezbeđuje optimalnu zaštitu bez potrebe za agresivnim hemijskim preparatima.", "title": "Pravilna svakodnevna higijena dojki"}, {"bullets": ["<strong>Zlatne kapi mleka:</strong> Nakon svakog podoja <strong>istisnuti kap-dve sopstvenog mleka</strong> i premazati bradavicu i areolu radi bržeg zarastanja.", "<strong>Udoban pamučni grudnjak:</strong> Grudnjaci za dojenje od <strong>čistog pamuka bez žice</strong>; ne smeju pritiskati dojke niti izazivati zastoj mleka.", "<strong>Redovna promena tufera:</strong> Vlažni tuferi stvaraju toplu i vlažnu sredinu pogodnu za gljivice; <strong>menjati tufere čim postanu vlažni</strong>."], "text": "Pravilna preventivna nega bradavica čuva elastičnost tkiva i sprečava pojavu mikrotrauma.", "title": "Nega bradavica i odabir grudnjaka"}], "id": 12, "image": "slide12_breast_hygiene.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Ukloniti zablude o pranju bradavica pre svakog podoja i očuvati integritet kože areole.", "greske": "Savetovanje majkama da prebrišu bradavice alkoholom, vlažnim maramicama ili sapunom pre nego što stave bebu na dojku.", "pitanje": "Koja je fiziološka uloga Montgomerijevih žlezda na areoli dojke?", "teze": "One luče prirodni baktericidni lipidni film koji podmazuje kožu i ima miris koji novorođenče prepoznaje instinktivno iz materice."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Pranje bradavica", "val": "Samo voda"}, {"lbl": "Pre podoja", "val": "0 sapuna"}, {"lbl": "Pamučni tuferi", "val": "100%"}], "module": "Modul 2: Dojenje", "subtitle": "Modul 2: Dojenje • Tema 10", "title": "Higijena i nega dojki tokom laktacije", "title_styled": "Higijena i nega dojki <em>tokom laktacije</em>"}, {"badge": "STIMULACIJA PROTOKA", "bg_theme": "light", "category": "MODUL 2 • TEMA 11", "content_blocks": [{"bullets": ["<strong>Topla vlažna obloga:</strong> Pre podoja staviti <strong>toplu pelenu 3–5 minuta</strong> ili se istuširati toplom vodom radi <strong>širenja mlečnih kanala</strong>.", "<strong>Masaža dojki (pokreti maženja):</strong> Nežni kružni pokreti jagodicama prstiju <strong>od baze dojke ka bradavici</strong> stimulišu protok mleka.", "<strong>Protresanje dojki:</strong> Blago naginjanje napred i lagano protresanje dojki <strong>koristi gravitaciju za pokretanje mleka</strong> ka sinusima."], "text": "Priprema tkiva dojke neposredno pre podoja olakšava izlazak mleka i smanjuje nelagodnost kod prepunjenih dojki.", "title": "Termoterapija i stimulacija protoka"}, {"bullets": ["<strong>Oksitocin – hormon otpuštanja:</strong> Stres, bol i nervoza blokiraju let-down; <strong>smirenost majke i podrška dadilje</strong> direktno pojačavaju mlaz mleka.", "<strong>Ritual opuštanja:</strong> <strong>Čaša tople vode ili čaja pre podoja</strong>, udoban položaj sa osloncem za leđa i ruke, smiren ambijent bez žurbe.", "<strong>Senzorna stimulacija:</strong> <strong>Gledanje u bebu, mirisanje bebine kapice</strong> i kontakt koža na kožu trenutno aktiviraju refleks otpuštanja mleka."], "text": "Refleks otpuštanja mleka (let-down) je primarno neurohumoralni refleks koji direktno zavisi od emocionalnog stanja majke.", "title": "Psihološko opuštanje i refleks otpuštanja"}], "id": 13, "image": "slide13_breast_prep.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Naučiti polaznice kako da praktično pomognu majci da aktivira refleks otpuštanja mleka pre postavljanja bebe.", "greske": "Forsiranje bebe na tvrdu, prenapregnutu dojku dok beba plače, što dovodi do oštećenja bradavice i odbijanja podoja.", "pitanje": "Kako adrenalin utiče na laktaciju i refleks otpuštanja mleka?", "teze": "Adrenalin sužava krvne sudove i direktno inhibira delovanje oksitocina na mioepitelne ćelije oko alveola, sprečavajući istiskivanje mleka ka sinusima."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Hormon otpuštanja", "val": "Oksitocin"}, {"lbl": "Topla termoterapija", "val": "3-5 min"}, {"lbl": "Edem areole", "val": "Omekšavanje"}], "module": "Modul 2: Dojenje", "subtitle": "Modul 2: Dojenje • Tema 11", "title": "Priprema dojki za podoj: Let-down protokol", "title_styled": "Priprema dojki za podoj: <em>Let-down protokol</em>"}, {"badge": "ERGONOMSKI POLOŽAJI", "bg_theme": "light", "category": "MODUL 2 • TEMA 12", "content_blocks": [{"bullets": ["<strong>Položaj kolevke (Cradle):</strong> Klasičan položaj; bebin trup je <strong>okrenut stomak na stomak sa majkom</strong>, uho, rame i kuk su u istoj ravni.", "<strong>Unakrsna kolevka (Cross-cradle):</strong> Suprotna ruka pridržava bebinu bazu glave; <strong>idealan položaj za učenje i postizanje dubokog hvata</strong>.", "<strong>Pravilo nos-bradavica:</strong> Bebin nosić je <strong>u visini bradavice pre nego što otvori usta</strong>, tako da glava ide u blagu ekstenziju unazad."], "text": "Pravilna ergonomija položaja štiti kičmu majke i omogućava bebi nesmetano disanje i gutanje.", "title": "Kolevka i unakrsna kolevka (Cradle / Cross-cradle)"}, {"bullets": ["<strong>Fudbalska lopta (Ragbi hvat):</strong> Beba podvučena pod majčin pazuh; <strong>idealan za mame nakon carskog reza, blizance i prepunjene dojke</strong>.", "<strong>Ležeći položaj na boku:</strong> Majka i beba leže okrenute jedna ka drugoj; <strong>omogućava odmor majci tokom noćnih podoja</strong> bez pritiska na ranu.", "<strong>Uspravan biološki položaj (Laid-back):</strong> Majka poluleži zavaljena pod uglom od 45°; <strong>beba leži na njenom telu i koristi urođene reflekse</strong>."], "text": "Alternativni položaji pružaju rasterećenje abdominalnog zida i omogućavaju efikasnije pražnjenje lateralnih delova dojke.", "title": "Fudbalska lopta (Ragbi hvat) i bočni položaj"}], "id": 14, "image": "slide12_breastfeeding_positions.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Ovladati anatomskim položajima pri dojenju i individualno ih prilagoditi stanju majke.", "greske": "Naginjanje majke prema bebi umesto privlačenja bebe dojci, što izaziva hronične bolove u leđima i plitak hvat.", "pitanje": "Zašto je ragbi hvat (ispod pazuha) prvi izbor kod žena koje su se porodile carskim rezom?", "teze": "Ragbi hvat potpuno rasterećuje prednji trbušni zid i rez od carskog reza, a istovremeno majci omogućava odličan vizuelni pregled nad bebinim ustima."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Osnovna položaja", "val": "4 ključna"}, {"lbl": "Ergonomija majke", "val": "0 naprezanja"}, {"lbl": "Orijentacija tela", "val": "Stomak-na-stomak"}], "module": "Modul 2: Dojenje", "subtitle": "Modul 2: Dojenje • Tema 12", "title": "Položaji pri dojenju: Ergonomija za majku i bebu", "title_styled": "Položaji pri dojenju: <em>Ergonomija za majku i bebu</em>"}, {"badge": "BIOMEHANIKA HVATA", "bg_theme": "light", "category": "MODUL 2 • TEMA 13", "content_blocks": [{"bullets": ["<strong>Asimetrični hvat:</strong> Bradavica je usmerena <strong>ka bebinom nosiću</strong>; beba prvo donjom usnom zahvata <strong>znatno veći deo areole odozdo</strong> nego odozgo.", "<strong>Široko otvorena usta:</strong> Sačekati da beba otvori usta <strong>pod uglom većim od 130–140°</strong> (kao pri zevanju); doticati bebinu gornju usnu bradavicom.", "<strong>Privlačenje bebe dojci:</strong> Beba se <strong>brzim i odlučnim pokretom privlači ka dojci</strong>, a nikada se dojka ne gura u bebina poluotvorena usta!"], "text": "Asimetrični hvat omogućava bradavici da uđe duboko u meko nepce gde je zaštićena od pritiska tvrdog nepca i desni.", "title": "Biomehanika asimetričnog hvata"}, {"bullets": ["<strong>Riblja usta:</strong> Donja i gornja usna su <strong>široko izvrnute ka spolja</strong>; bradavica i veći deo areole su duboko u bebinim ustima.", "<strong>Brada uvučena u dojku:</strong> Bebina brada <strong>čvrsto dodiruje dojku</strong>, dok je nosić slobodan za disanje; obrazi su puni i zaobljeni.", "<strong>Čujno gutanje bez bola:</strong> Čuje se ritmičan zvuk gutanja (\"ka-gut\"); <strong>pravilan podoj je potpuno bezbolan</strong> nakon prvih par sekundi."], "text": "Efikasan podoj se prepoznaje po spoljašnjim vizuelnim znacima i zvučnim potvrdama gutanja mleka.", "title": "Znaci pravilnog i efikasnog podoja"}], "id": 15, "image": "slide15_latch_technique.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Uvežbati asimetrični hvat do detalja i naučiti prepoznavanje plitkog hvata pre nego što nastanu oštećenja.", "greske": "Guranje dojke bebi u usta dok su usta poluotvorena, što rezultira time da beba sisa samo vrh bradavice.", "pitanje": "Koji zvuci tokom podoja ukazuju na to da je hvat nepravilan?", "teze": "Coktanje, škljocanje jezikom i uvlačenje obraza (jamice) ukazuju na gubljenje vakuuma i plitak hvat. Mora se čuti mirno, duboko gutanje (\"ka-hu\")."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Ugao otvaranja usta", "val": "140°"}, {"lbl": "Donja areola u ustima", "val": "Asimetrija"}, {"lbl": "Glavni indikator", "val": "Bez bola"}], "module": "Modul 2: Dojenje", "subtitle": "Modul 2: Dojenje • Tema 13", "title": "Pravilno postavljanje bebe na dojku (Asimetrični hvat)", "title_styled": "Pravilno postavljanje bebe na dojku <em>(Asimetrični hvat)</em>"}, {"badge": "PREVENCIJA I TRETMAN", "bg_theme": "light", "category": "MODUL 2 • TEMA 14", "content_blocks": [{"bullets": ["<strong>Uzrok nastanka ragada:</strong> U 95% slučajeva uzrok je <strong>nepravilan, plitak hvat</strong> gde beba desnima stiska samu bradavicu umesto areole.", "<strong>Korekcija hvata je prioritet:</strong> Nikakve kreme neće pomoći ako se ne popravi hvat; <strong>beba mora uhvatiti pun zalogaj areole</strong>.", "<strong>Prekid vakuuma bez traume:</strong> <strong>NIKADA ne vući bebu sa dojke na silu</strong>! Prekinuti vakuum guranjem <strong>čistog malog prsta u ugao bebinih usana</strong>."], "text": "Ragade su mehanička oštećenja kože bradavica koja nastaju usled nepravilne dinamike sisanja.", "title": "Etiologija nastanka i korekcija uzroka"}, {"bullets": ["<strong>100% čist medicinski lanolin:</strong> Naneti <strong>sloj ultraprečišćenog lanolina nakon svakog podoja</strong>; deluje po principu vlažnog zarastanja i <strong>ne ispira se</strong>.", "<strong>Vazdušne kupke:</strong> Ostaviti dojke <strong>izložene vazduhu 10–15 minuta nakon podoja</strong> radi brže epitelizacije.", "<strong>Silikonske bradavice (privremeno rešenje):</strong> Koristiti samo kao <strong>kratkotrajni most od 2–3 dana</strong> kod krvarećih ragada, uz stručni nadzor."], "text": "Savremeni tretman ragada zasniva se na principu vlažnog zarastanja rane i prevenciji sekundarne bakterijske infekcije.", "title": "Protokol lokalnog lečenja i regeneracije"}], "id": 16, "image": "slide13_lactation_challenges.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Naučiti polaznice kako da u roku od nekoliko minuta identifikuju uzrok bola pri dojenju i saniraju ragade.", "greske": "Prekidanje dojenja zbog ragada i agresivno pranje sapunima i dezinficijensima koji onemogućavaju zarastanje.", "pitanje": "Kako pravilno prekinuti podoj ako beba spava na dojci ili je hvat bolan?", "teze": "Nežno gurnuti opran mali prst u ugao bebinog jezika i usana dok se ne čuje popuštanje vakuuma, pa tek onda lagano izvući bradavicu."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Uzrok plitak hvat", "val": "95%"}, {"lbl": "Medicinski lanolin", "val": "100%"}, {"lbl": "Prevencija isušivanja", "val": "0 sapuna"}], "module": "Modul 2: Dojenje", "subtitle": "Modul 2: Dojenje • Tema 14", "title": "Ispucale bradavice (Ragade): Prevencija i tretman", "title_styled": "Ispucale bradavice (Ragade): <em>Prevencija i tretman</em>"}, {"badge": "DIFERENCIJALNA DIJAGNOZA", "bg_theme": "light", "category": "MODUL 2 • TEMA 15", "content_blocks": [{"bullets": ["<strong>Prepunjenost (Engorgement):</strong> Obe dojke su <strong>tvrde, tople i otečene</strong> 3–5. dana po porođaju; <strong>nema visoke temperature</strong>, rešava se čestim pražnjenjem.", "<strong>Začepljen mlečni kanal:</strong> <strong>Osetljiv, tvrd i bolan čvorić</strong> na jednoj dojci bez opštih simptoma; bebu postavljati tako da joj je <strong>brada usmerena ka čvoriću</strong>.", "<strong>Mastitis (Upala tkiva dojke):</strong> <strong>Crveno, vrelo i bolno polje na jednoj dojci</strong>, praćeno jezom, drhtavicom i <strong>visokom temperaturom preko 38.5°C</strong>."], "text": "Diferencijalna dijagnoza između fiziološke prepunjenosti, zastoja mleka i bakterijskog mastitisa ključna je za pravovremenu terapiju.", "title": "Razlikovanje prepunjenosti i mastitisa"}, {"bullets": ["<strong>Dojenje se NIKADA ne prekida:</strong> Mleko iz upaljene dojke je <strong>potpuno bezbedno za bebu</strong>; često pražnjenje je <strong>osnovni lek za mastitis</strong>!", "<strong>Toplo-hladno protokol:</strong> <strong>Topla obloga 5 min pre podoja</strong> za širenje kanala; <strong>hladna obloga (hladan peškir) nakon podoja</strong> radi ublažavanja otoka.", "<strong>Crveni alarm za antibiotike:</strong> Temperatura <strong>preko 38.5°C duže od 24 sata</strong> zahteva hitan pregled ginekologa i <strong>uvođenje antibiotika bezbednih za dojenje</strong>."], "text": "Pravilan redosled primene toplote, masaže i hladnih obloga dovodi do brze rezolucije upalnog procesa.", "title": "Klinički protokol termoterapije i masaže"}], "id": 17, "image": "slide17_mastitis_protocol.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Ovladati jasnim algoritmom postupanja kod zastoja mleka i mastitisa bez nepotrebnog prekidanja laktacije.", "greske": "Prekidanje dojenja na bolesnoj dojci, što stvara još gori zastoj i vodi direktno ka stvaranju apscesa.", "pitanje": "Zašto je bezbedno i preporučljivo da beba doji na dojci zahvaćenoj mastitisom?", "teze": "Želudačna kiselina bebe uništava bakterije, a beba je najefikasnija pumpa za pražnjenje zapušenog mlečnog kanala. Naglasiti da majka mora da miruje i uzima tečnost."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Temperatura kod mastitisa", "val": ">38.5°C"}, {"lbl": "Dojenja obavezan", "val": "Nastavak"}, {"lbl": "Rok za lekara", "val": "24 sata"}], "module": "Modul 2: Dojenje", "subtitle": "Modul 2: Dojenje • Tema 15", "title": "Upala dojki: Prepunjenost i mastitis", "title_styled": "Upala dojki: <em>Prepunjenost i mastitis</em>"}, {"badge": "METODE IZMAZANJA", "bg_theme": "light", "category": "MODUL 2 • TEMA 16", "content_blocks": [{"bullets": ["<strong>Položaj prstiju u obliku slova 'C':</strong> Postaviti palac i kažiprst <strong>2.5–3 cm iza baze bradavice</strong>, naspramno na ivicu areole.", "<strong>Trostepeni pokret (Pritisni-Spoj-Opusti):</strong> <strong>1. Pritisnuti</strong> ka grudnom košu; <strong>2. Blago spojiti</strong> prste; <strong>3. Opustiti</strong>. Rotirati prste u krug.", "<strong>Stroge zabrane:</strong> <strong>NIKADA ne stiskati i ne čupati samu bradavicu</strong>, i nikada ne kliziti prstima preko kože jer to izaziva modrice i oštećenja!"], "text": "Marmetova tehnika simulira prirodno sisanje bebe i predstavlja najbezbedniji način pražnjenja mlečnih sinusa bez traume tkiva.", "title": "Ručno izmazanje po Marmetovoj tehnici"}, {"bullets": ["<strong>Odabir odgovarajućeg levka:</strong> Prečnik tunela levka mora biti <strong>za 2–4 mm veći od prečnika bradavice</strong>; bradavica se mora slobodno kretati bez trenja.", "<strong>Dvofazni režim pumpanja:</st
