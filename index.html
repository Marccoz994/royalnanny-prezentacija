rong> Prvih 2 minuta <strong>brza i plitka stimulacija (let-down faza)</strong>, a zatim prelazak na <strong>sporiji i dublji ritam izmazanja</strong>.", "<strong>Higijena i sterilizacija delova:</strong> Rastaviti sve silikonske ventile i membrane; <strong>oprati toplom vodom i namenskim deterdžentom, pa sterilisati</strong>."], "text": "Pravilan izbor veličine levka i režima rada izdajalice obezbeđuje maksimalan prinos mleka bez bola.", "title": "Izdajalice: Mehaničke i električne"}], "id": 18, "image": "slide18_milk_expression.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Naučiti polaznice demonstraciji Marmet tehnike ručnog izmazanja i pravilnom rukovanju izdajalicama.", "greske": "Trljanje i klizanje prstiju po koži tokom ručnog izmazanja (stvara modrice) i korišćenje preuskog levka na električnoj pumpici.", "pitanje": "Zašto se bradavica ne sme stiskati i čupati tokom ručnog izmazanja?", "teze": "Mlečni sinusi se nalaze ispod areole, a ne u bradavici. Stiskanje bradavice zatvara kanaliće, izaziva jak bol i može oštetiti osetljive nerve."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Ručna tehnika", "val": "Marmet"}, {"lbl": "Položaj prstiju iza areole", "val": "2-3 cm"}, {"lbl": "Levka pumpice", "val": "Pravilna veličina"}], "module": "Modul 2: Dojenje", "subtitle": "Modul 2: Dojenje • Tema 16", "title": "Izmazanje majčinog mleka: Tehnike i higijena", "title_styled": "Izmazanje majčinog mleka: <em>Tehnike i higijena</em>"}, {"badge": "PROTOKOL SKLADIŠTENJA", "bg_theme": "light", "category": "MODUL 2 • TEMA 17", "content_blocks": [{"bullets": ["<strong>Sobna temperatura (do 25°C):</strong> Sveže izdojeno mleko može stajati <strong>maksimalno 4 sata</strong> na sobnoj temperaturi.", "<strong>Frižider (na polici na 4°C):</strong> Mleko se čuva <strong>do 3–4 dana u dubini frižidera</strong>; <strong>NIKADA ne držati u vratima</strong> zbog temperaturnih oscilacija!", "<strong>Zamrzivač (-18°C do -20°C):</strong> Mleko se čuva <strong>do 6 meseci</strong> u namenskim sterilnim kesicama sa <strong>označenim tačnim datumom i količinom</strong>."], "text": "Pravilno skladištenje čuva nutritivne i imunološke komponente majčinog mleka i sprečava razvoj bakterija.", "title": "Zlatno pravilo 4-4-6 skladištenja mleka"}, {"bullets": ["<strong>Odmrzavanje u frižideru:</strong> Mleko premestiti iz zamrzivača u frižider <strong>12 sati pre upotrebe</strong>; lagano odmrzavanje čuva sve vitamine i antitela.", "<strong>Zagrevanje u vodenoj kupki:</strong> Zagrejati posudu sa vodom <strong>do maksimalno 40°C</strong> i u nju uroniti flašicu; <strong>NIKADA ne prokuvavati mleko</strong>!", "<strong>STROGA ZABRANA MIKROTALASNE:</strong> Mikrotalasna je <strong>STROGO ZABRANJENA</strong> jer stvara \"vruće tačke\" koje izazivaju <strong>opekotine i uništavaju antitela</strong>.", "<strong>Pravilo jednog ciklusa:</strong> Jednom odmrznuto mleko se <strong>nikada ponovo ne zamrzava</strong>; ostatak iz flašice se <strong>baca nakon 2 sata od početka obroka</strong>."], "text": "Termička obrada izdojenog mleka zahteva strogu kontrolu temperature radi očuvanja termolabilnih antitela.", "title": "Pravilan protokol odmrzavanja i zagrevanja"}], "id": 19, "image": "slide14_milk_storage_protocol.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti međunarodne protokole bezbednog skladištenja i manipulacije humanim mlekom.", "greske": "Držanje mleka u vratima frižidera, grejanje u mikrotalasnoj rerni i ponovno zamrzavanje preostalog mleka.", "pitanje": "Zašto se izdojeno mleko tokom stajanja u frižideru razdvaja na dva sloja i šta treba uraditi pre hranjenja?", "teze": "To je prirodno razdvajanje mlečne masti koja isplivava na površinu. Flašicu ne treba snažno mućkati, već lagano kružno promešati da se emulzija sjedini."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Sobna temp (<25°C)", "val": "4 sata"}, {"lbl": "Frižider (4°C)", "val": "4 dana"}, {"lbl": "Zamrzivač (-18°C)", "val": "6 meseci"}], "module": "Modul 2: Dojenje", "subtitle": "Modul 2: Dojenje • Tema 17", "title": "Čuvanje i odmrzavanje majčinog mleka", "title_styled": "Čuvanje i odmrzavanje <em>majčinog mleka</em>"}, {"badge": "VEŠTAČKA ISHRANA", "bg_theme": "light", "category": "MODUL 2 • TEMA 18", "content_blocks": [{"bullets": ["<strong>Prokuvavanje vode na 70°C:</strong> Voda mora biti prokuvana i ohlađena na <strong>tačno 70°C pre mešanja</strong> radi ubijanja opasne bakterije <em>Cronobacter sakazakii</em>.", "<strong>Prvo voda, pa prah:</strong> Uvek <strong>prvo sipati tačnu količinu vode</strong>, a zatim dodavati <strong>ravne (ne prepunjene) merice praha</strong> namenskim nožićem.", "<strong>Stroga zabrana menjanja razmere:</strong> <strong>NIKADA ne dodavati više ili manje vode</strong>; previše praha opterećuje bubrege, a previše vode dovodi do pothranjenosti!"], "text": "Priprema adaptiranog mleka zahteva striktno poštovanje higijenskih standarda i preporučenih temperatura Svetske zdravstvene organizacije.", "title": "Egzaktna pravila pripreme formule"}, {"bullets": ["<strong>Provera temperature (oko 37°C):</strong> Flašicu ohladiti pod mlazom hladne vode; <strong>kapnuti nekoliko kapi na unutrašnju stranu podlaktice</strong> pre davanja bebi.", "<strong>Pravilo 60 minuta:</strong> Pripremljena formula se mora <strong>potrošiti u roku od 1 sata</strong> na sobnoj temperaturi; <strong>ostatak se odmah baca</strong>.", "<strong>Isključivo novo pakovanje:</strong> Otvorena limenka formule se čuva na suvom i hladnom mestu i mora se <strong>potrošiti u roku od 3–4 nedelje</strong>."], "text": "Pripremljena formula je idealna podloga za brzi rast bakterija na sobnoj temperaturi.", "title": "Bezbednost hranjenja i pravilo 60 minuta"}], "id": 20, "image": "slide15_formula_prep_protocol.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti stroge laboratorijske i kliničke standarde pripreme adaptiranog mleka bez odstupanja.", "greske": "Dodavanje \"još malo praha da beba bolje spava\", sipanje praha u ključalu vodu (uništava vitamine) i čuvanje nepopijene formule za kasnije.", "pitanje": "Zašto se adaptirana formula nikada ne sme pripremati sa vrelom ključalom vodom preko 70°C?", "teze": "Previsoka temperatura denaturiše proteine, razara dodate probiotske kulture i uništava termolabilne vitamine (poput vitamina C)."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Na 30 ml vode", "val": "1 merica"}, {"lbl": "Temperatura vode", "val": "40-50°C"}, {"lbl": "Pravilo upotrebe", "val": "60 min"}], "module": "Modul 2: Dojenje", "subtitle": "Modul 2: Dojenje • Tema 18", "title": "Adaptirana formula: Priprema, higijena i bezbednost", "title_styled": "Adaptirana formula: <em>Priprema, higijena i bezbednost</em>"}, {"badge": "IMUNIZACIJA", "bg_theme": "light", "category": "MODUL 3 • TEMA 19", "content_blocks": [{"bullets": ["<strong>Vakcine u porodilištu (prvih 24–48h):</strong> Beba prima <strong>BCG vakcinu</strong> u levo rame i <strong>prvu dozu Hepatitis B vakcine</strong> u butinu.", "<strong>Imunizacija sa navršenih 2 meseca:</strong> Kombinovana petovalentna/šestovalentna vakcina (<strong>DTaP-IPV-Hib-HepB</strong>) i <strong>pneumokokna konjugovana vakcina</strong>.", "<strong>Revakcinacije tokom prve godine:</strong> Davanje druge i treće doze prema kalendaru u razmacima od <strong>najmanje 4–6 nedelja</strong>."], "text": "Pravovremena vakcinacija pruža specifičan imunološki štit protiv najtežih zaraznih bolesti dečjeg doba.", "title": "Kalendar obavezne imunizacije u RS"}, {"bullets": ["<strong>Pregled pedijatra pre vakcine:</strong> Dete mora biti <strong>potpuno zdravo, afebrilno i pregledano od strane pedijatra</strong> neposredno pre aplikacije vakcine.", "<strong>Odlaganje vakcinacije:</strong> Akutne febrilne infekcije sa temperaturom <strong>preko 38°C zahtevaju odlaganje</strong> do potpunog oporavka; blaga prehlada nije prepreka.", "<strong>Priprema deteta:</strong> Beba treba da bude <strong>nahrana i naspavana</strong>; dadilja obezbeđuje mirnu atmosferu i nežan kontakt nakon uboda."], "text": "Priprema deteta pre odlaska u dom zdravlja smanjuje stres i omogućava bezbednu aplikaciju vakcine.", "title": "Protokol pripreme deteta za vakcinaciju"}], "id": 21, "image": "slide20_vaccination_schedule.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Upoznati polaznice sa zvaničnim kalendarom imunizacije i ulogom negovateljice u pripremi deteta za posetu pedijatru.", "greske": "Davanje preventivnih sirupa za snižavanje temperature pre odlaska na vakcinaciju (smanjuje imuni odgovor organizma).", "pitanje": "Koja medicinska dokumentacija je obavezna prilikom svakog odlaska na vakcinaciju?", "teze": "Zdravstvena knjižica deteta i karton imunizacije. Dete pre vakcine mora proći auskultatorni pregled pluća, pregled ždrela i merenje telesne temperature."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Na rođenju", "val": "BCG & HepB"}, {"lbl": "Petovalentna vakcina", "val": "3 doze"}, {"lbl": "MMR vakcina", "val": "12-15 m"}], "module": "Modul 3: Nega odojčeta", "subtitle": "Modul 3: Nega odojčeta • Tema 19", "title": "Vakcinacija odojčeta: Kalendar imunizacije i priprema", "title_styled": "Vakcinacija odojčeta: <em>Kalendar imunizacije i priprema</em>"}, {"badge": "BORAVAK U PRIRODI", "bg_theme": "light", "category": "MODUL 3 • TEMA 20", "content_blocks": [{"bullets": ["<strong>Prva šetnja nakon rođenja:</strong> Zdravo novorođenče rođeno u terminu može u prvu kratku šetnju već <strong>nakon 7–10 dana života</strong> (15–20 minuta).", "<strong>Temperaturne granice:</strong> Izlazak se preporučuje na temperaturama <strong>od -5°C do +30°C</strong>; izbegavati dane sa maglom, jakim vetrom, pljuskovima ili smogom.", "<strong>Najbolje doba dana:</strong> Leti šetati <strong>isključivo u ranim jutarnjim (do 10h) i kasnim popodnevnim satima (posle 17h)</strong>; zimi oko podneva."], "text": "Boravak na svežem vazduhu jača imuni sistem, podstiče sintezu vitamina D i podržava prirodan cirkadijalni ritam.", "title": "Vreme prvog izlaska i adaptacija"}, {"bullets": ["<strong>Ravna korpa u prvih 6 meseci:</strong> Beba se vozi isključivo u <strong>potpuno ravnoj korpi sa čvrstim dušekom</strong> radi pravilnog razvoja kičme i disajnih puteva.", "<strong>STROGA ZABRANA PREKRIVANJA KOLICA PELENOM:</strong> Prekrivanje kolica tetra pelenom stvara <strong>smrtonosni efekat staklene bašte</strong> (temperatura raste za 4–7°C za 15 minuta)!", "<strong>Zaštita od sunca:</strong> Do 6 meseci <strong>ne koristiti hemijske kreme sa UV faktorom</strong>; zaštita se postiže hladovinom, suncobranom i šeširićem."], "text": "Kolica i beba moraju biti zaštićeni u skladu sa strogim bezbednosnim pedijatrijskim preporukama.", "title": "Pravila zaštite tokom šetnje"}], "id": 22, "image": "slide22_outdoor_stroller.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti bezbednosne preporuke za šetnju i eliminisati uobičajeni strah od izvođenja novorođenčeta.", "greske": "Prekrivanje otvora kolica pelenom tokom leta (stvara efekat staklene bašte sa temperaturama preko 40°C unutar kolica) i pretopljavanje deteta.", "pitanje": "Zašto je opasno prekriti bebi kolica pamučnom pelenom tokom letnjih meseci?", "teze": "Pelena zaustavlja cirkulaciju vazduha, a temperatura unutar kolica raste za 10-15°C za samo 20 minuta, stvarajući opasnost od toplotnog udara."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Prvi izlazak bebe", "val": "2-3. nedelja"}, {"lbl": "Bezbedan raspon", "val": "-5 do +30°C"}, {"lbl": "Letnji raspored", "val": "Pre 10h / Posle 17h"}], "module": "Modul 3: Nega odojčeta", "subtitle": "Modul 3: Nega odojčeta • Tema 20", "title": "Šetnja i boravak na svežem vazduhu", "title_styled": "Šetnja i boravak <em>na svežem vazduhu</em>"}, {"badge": "ISHRANA ODOJČETA", "bg_theme": "light", "category": "MODUL 3 • TEMA 21", "content_blocks": [{"bullets": ["<strong>Optimalan uzrast za početak:</strong> Između <strong>navršenih 4 i 6 meseci</strong> (nikada pre 17. nedelje, niti posle 26. nedelje života).", "<strong>Znaci spremnosti deteta:</strong> Dete <strong>samostalno drži glavicu i stabilno sedi uz podršku</strong>, pokazuje interesovanje za hranu, <strong>nestao je refleks guranja hrane jezikom</strong>.", "<strong>Pravilo 3 dana:</strong> Svaka nova namirnica uvodi se <strong>pojedinačno tokom 3 uzastopna dana</strong>, u prepodnevnim satima, radi uočavanja alergija.", "<strong>Redosled uvođenja:</strong> Prvo <strong>blago povrće</strong> (tikvica, šargarepa, krompir), zatim <strong>žitarice bez glutena</strong> (pirinač, proso), pa <strong>voće</strong> (jabuka, kruška)."], "text": "Uvođenje nemlečne ishrane predstavlja tranziciju koja zahteva strpljenje i postepeno privikavanje probavnog trakta.", "title": "Znaci zrelosti i redosled namirnica"}, {"bullets": ["<strong>STROGA ZABRANA SOLI I ŠEĆERA:</strong> Hrana za bebe se <strong>nikada ne soli i ne zaslađuje</strong>; so opterećuje nezrele bubrege deteta!", "<strong>ZABRANJEN MED U PRVOJ GODINI:</strong> Med je <strong>STROGO ZABRANJEN pre 12 meseci</strong> zbog smrtonosnog rizika od <strong>dečjeg botulizma</strong>!", "<strong>Zabrana svežeg kravljeg mleka:</strong> Kravlje mleko kao napitak je <strong>zabranjeno pre 1. godine</strong> zbog rizika od mikroskopskih krvarenja u crevima i anemije."], "text": "Nezreo probavni trakt i bubrezi odojčeta ne mogu da prerade određene namirnice koje mogu biti toksične.", "title": "Stroge zabrane i bezbednost u prvoj godini"}], "id": 23, "image": "slide23_solid_food_weaning.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti pedijatrijski protokol uvođenja dohrane i bezbednosna pravila prevencije alergija i gušenja.", "greske": "Uvođenje više namirnica odjednom, soljenje bebi hrane i davanje meda deci mlađoj od 12 meseci.", "pitanje": "Zašto se nove namirnice uvek uvode u prepodnevnim časovima?", "teze": "Ukoliko se razvije alergijska reakcija (osip, povraćanje, otok), ona se javlja tokom dana kada je lako dostupna pedijatrijska pomoć, a ne tokom noći."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Uzrast za početak", "val": "4-6 meseci"}, {"lbl": "Testiranje namirnice", "val": "3 dana"}, {"lbl": "Do 1. godine", "val": "0 soli / šećera"}], "module": "Modul 3: Nega odojčeta", "subtitle": "Modul 3: Nega odojčeta • Tema 21", "title": "Uvođenje čvrste hrane (Nemlečna dohrana)", "title_styled": "Uvođenje čvrste hrane <em>(Nemlečna dohrana)</em>"}, {"badge": "RAZVOJ I NAVIKE", "bg_theme": "light", "category": "MODUL 3 • TEMA 22", "content_blocks": [{"bullets": ["<strong>Tummy time (Boravak na stomaku):</strong> Praktikovati <strong>od prvih dana života dok je beba budna i pod nadzorom</strong>; jača vratne mišiće i sprečava zaravnjenje glave.", "<strong>Dnevno-noćni ritam:</strong> Danju održavati <strong>normalnu dnevnu svetlost i kućne zvuke</strong>; noću sobu zamračiti i hraniti bebu u tišini bez razgovora.", "<strong>Ritual pred spavanje:</strong> Ponavljati <strong>isti redosled svako veče</strong> (kupanje, masaža, oblačenje pidžame, podoj, uspavljivanje u krevecu)."], "text": "Zdrave životne navike formiraju se od prvih meseci života kroz predvidivu i smirujuću dnevnu rutinu.", "title": "Uspostavljanje ritma i fizičke higijene"}, {"bullets": ["<strong>Prirodan motorni razvoj:</strong> <strong>Ne forsirati bebu u prevremeno sedenje i stajanje</strong>; detetu omogućiti bezbedan prostor na podu na čvrstoj podlozi.", "<strong>STROGA ZABRANA HODALICA (DUBKA):</strong> Dubak je <strong>zvanično zabranjen od strane pedijatara</strong> jer izaziva deformitete stopala i kičme i nosi ogroman rizik od prevrtanja!", "<strong>Ekrani zabranjeni do 2. godine:</strong> <strong>Nema gledanja televizije, telefona ili tableta</strong> pre navršene 2. godine života radi zdravog razvoja mozga i pažnje."], "text": "Razvoj krupne motorike zahteva slobodu pokreta bez upotrebe pasivizirajućih i opasnih rekvizita.", "title": "Podsticanje motorike i standardi igre"}], "id": 24, "image": "slide24_healthy_habits.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti principe stimulacije motornog razvoja i eliminisati štetne faktore iz bebinog okruženja.", "greske": "Korišćenje dubaka/hodalica, prekomerno držanje bebe u njihalicama i puštanje crtanih filmova na telefonu bebama.", "pitanje": "Zašto pedijatri i dečji fizijatri širom sveta jednoglasno zabranjuju upotrebu dubaka za bebe?", "teze": "Dubak uskraćuje bebi prirodnu fazu puzanja, stavlja opterećenje na nezrele kukove pre vremena i sprečava razvoj refleksa ravnoteže i odbrane rukama pri padu."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Svakodnevno", "val": "Tummy Time"}, {"lbl": "Pre 2. godine", "val": "0 ekrana"}, {"lbl": "Ritam dan / noć", "val": "Cirkadijalni"}], "module": "Modul 3: Nega odojčeta", "subtitle": "Modul 3: Nega odojčeta • Tema 22", "title": "Zdrave životne navike i motorni razvoj", "title_styled": "Zdrave životne navike i <em>motorni razvoj</em>"}, {"badge": "ORALNO ZDRAVLJE", "bg_theme": "light", "category": "MODUL 3 • TEMA 23", "content_blocks": [{"bullets": ["<strong>Vreme i redosled nicanja:</strong> Najčešće počinje između <strong>5. i 8. meseca</strong>, prvo donji centralni sekutići; praćeno <strong>pojačanim lučenjem pljuvačke i guranjem predmeta u usta</strong>.", "<strong>Rashlađene gumene glodalice:</strong> Glodalice rashlađene u frižideru (<strong>nikada u zamrzivaču!</strong>) smanjuju upalu i ublažavaju bol u desnima.", "<strong>Masaža desni:</strong> Nežna masaža desni <strong>čistim silikonskim naprstkom ili vlažnom sterilnom gazicom</strong> pre spavanja.", "<strong>Mit o visokoj temperaturi:</strong> Nicanje zuba može dati samo subfebrilnu temperaturu (<strong>do 37.5°C</strong>); temperatura <strong>preko 38°C NIKADA nije od zuba</strong> već od infekcije!"], "text": "Nicanje zubića je fiziološki proces koji kod većine odojčadi izaziva lokalnu nelagodnost, svrab i pojačanu salivaciju.", "title": "Simptomi denticije i olakšavanje tegoba"}, {"bullets": ["<strong>Oralna toaleta pre zuba:</strong> Pre nicanja prvog zuba prebrisati desni <strong>sterilnom gazicom natopljenom prokuvanom vodom</strong> jednom dnevno.", "<strong>Nega prvog zubića:</strong> Čim zub nikne, počinje pranje <strong>dečjom četkicom sa mekim vlaknima</strong> dva puta dnevno (veličina paste kao zrno pirinča bez fluora)."], "text": "Oralna higijena započinje pre nicanja prvog zuba radi uklanjanja naslaga mleka i prevencije ranog karijesa.", "title": "Pravilna higijena usne duplje i zubića"}], "id": 25, "image": "slide19_dentition_oral_care.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti pravilne metode ublažavanja bolova pri denticiji i protokole prevencije ranog karijesa.", "greske": "Pripisivanje visoke temperature od 39°C \"zubićima\", zaleđivanje glodalica u zamrzivaču i ostavljanje flašice bebi u krevetac noću.", "pitanje": "Zašto se anestetički gelovi sa lidokainom ne preporučuju za ublažavanje tegoba nicanja zuba?", "teze": "Lidokain umrtvljuje ždrelo, što može dovesti do gušenja pljuvačkom i mlekom, a prekomerna apsorpcija nosi rizik od sistemske toksičnosti i aritmija."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Prvi sekutići", "val": "4-7 meseci"}, {"lbl": "Gelovi za desni", "val": "0 lidokaina"}, {"lbl": "Pranje četkicom", "val": "Od 1. zubića"}], "module": "Modul 3: Nega odojčeta", "subtitle": "Modul 3: Nega odojčeta • Tema 23", "title": "Denticija (Nicanje zubića) i oralna higijena", "title_styled": "Denticija (Nicanje zubića) i <em>oralna higijena</em>"}, {"badge": "BEZBEDNOST PUTOVANJA", "bg_theme": "light", "category": "MODUL 3 • TEMA 24", "content_blocks": [{"bullets": ["<strong>Rear-facing položaj (u suprotnom smeru):</strong> Auto-sedište grupe 0+ (\"jaje\") <strong>mora biti okrenuto suprotno od smera vožnje</strong>; pruža <strong>5 puta veću zaštitu</strong> za bebin vrat i kičmu.", "<strong>Zatezanje pojasa (Test štipaljke):</strong> Sigurnosni pojas mora biti zategnut tako da <strong>između pojasa i bebinog tela stane samo jedan prst</strong>.", "<strong>Pravilo dva sata (Two-hour rule):</strong> Beba ne sme neprekidno provesti <strong>više od 2 sata u auto-sedištu</strong>; obavezne pauze sa vađenjem bebe i polaganjem na ravnu podlogu."], "text": "Pravilna upotreba homologovanog auto-sedišta je zakonska i medicinska obaveza; nikakvo držanje deteta u naručju ne može zameniti sedište.", "title": "Bezbednost u automobilu (Zlatni standard)"}, {"bullets": ["<strong>Klimatizacija u vozilu:</strong> Razlika između spoljašnje temperature i klime u automobilu <strong>ne sme prelaziti 5–6°C</strong>; usmeriti ventilaciju dalje od bebinog lica.", "<strong>Putovanje avionom:</strong> Tokom poletanja i sletanja <strong>ponuditi podoj, flašicu ili cuclu</strong>; gutanje izjednačava pritisak u srednjem uhu i sprečava jak bol.", "<strong>Priručna torba za hitne potrebe:</strong> Rezervna odeća, pelene, vlažne maramice, <strong>rehidracioni rastvor, paracetamol sirup i omiljena igračka/tešilica</strong> uvek pri ruci."], "text": "Putovanje sa odojčetom zahteva posebne mere zaštite od dehidracije, temperaturnih razlika i promena pritiska.", "title": "Klimatizacija, avion i priručna oprema"}], "id": 26, "image": "slide26_infant_car_seat.jpg", "layout": "split_right_image", "lecturer_notes": {"cilj": "Naučiti polaznice planiranju putovanja sa odojčetom uz poštovanje najviših bezbednosnih standarda.", "greske": "Vađenje bebe iz auto-sedišta tokom vožnje da bi se nahranila (smrtonosan rizik u slučaju kočenja) i preduga vožnja bez pauze.", "pitanje": "Zašto je položaj u suprotnom smeru od kretanja vozila (rear-facing) višestruko bezbedniji za bebe i malu decu?", "teze": "Bebina glava čini 25% ukupne mase tela, a vratni mišići i ligamenti su nerazvijeni. Pri frontalnom sudaru, sedište okrenuto unazad raspoređuje silu duž celih leđa i štiti kičmenu moždinu."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Suprotan smer vožnje", "val": "Rear-Facing"}, {"lbl": "Maksimalno u auto-sedištu", "val": "2 sata"}, {"lbl": "Razlika klime i spolja", "val": "Max 5-6°C"}], "module": "Modul 3: Nega odojčeta", "subtitle": "Modul 3: Nega odojčeta • Tema 24", "title": "Putovanje sa odojčetom: Vožnja i adaptacija", "title_styled": "Putovanje sa odojčetom: <em>Vožnja i adaptacija</em>"}, {"badge": "KOLIKE I SMIRIVANJE", "bg_theme": "light", "category": "MODUL 4 • TEMA 25", "content_blocks": [{"bullets": ["<strong>Vreme javljanja:</strong> Počinju oko <strong>2–3. nedelje života</strong>, dostižu vrhunac oko 6. nedelje, a spontano prestaju oko 3–4. meseca; najčešće <strong>kasno popodne i uveče</strong>.", "<strong>Vesselovo pravilo trojke:</strong> Plač duže od <strong>3 sata dnevno</strong>, više od <strong>3 dana u nedelji</strong>, tokom najmanje <strong>3 uzastopne nedelje</strong> kod zdrave bebe koja lepo napreduje.", "<strong>Klasičan izgled napada:</strong> Beba pocrveni u licu, <strong>grčevito privlači nožice ka stomaku</strong>, pesnice su stisnute, a stomak je napet i tvrd na dodir."], "text": "Infantilne kolike su prolazni fiziološki fenomen nezrelosti digestivnog i nervnog sistema koji se javlja kod potpuno zdrave dece.", "title": "Klinička slika i Vesselovo pravilo trojke"}, {"bullets": ["<strong>Položaj \"Tigar na grani\":</strong> Postaviti bebu <strong>potrbuške duž svoje podlaktice</strong> sa glavicom u pregibu lakta; blagi pritisak na stomak olakšava izbacivanje gasova.", "<strong>Toplota na stomačić:</strong> <strong>Topla pamučna pelena ili termofor sa košticama trešnje</strong> postavljen preko benkice ublažava grčeve creva.", "<strong>Masaža stomaka:</strong> Blagi kružni pokreti dlanom <strong>u smeru kretanja kazaljke na satu</strong>, uz savijanje bebenih nožica ka stomačiću.", "<strong>Bela buka i smirenje:</strong> Zvuk fena, usisivača ili tiha jednolična melodija pomaže <strong>reprogramiranju prenadraženog bebinog nervnog sistema</strong>."], "text": "Kombinacija posturalnih manevara, blage toplote i zvučne stimulacije donosi značajno olakšanje.", "title": "Efikasne tehnike olakšavanja tegoba"}], "id": 27, "image": "slide20_baby_colic_care.jpg", "layout": "split_right_image", "lecturer_notes": {"cilj": "Naučiti polaznice kako da prepoznaju kolike, primene tehnike umirivanja i pruže psihološki oslonac iscrpljenim roditeljima.", "greske": "Panika, besomučno menjanje formula na svoju ruku, prekidanje dojenja i davanje neproverenih narodnih čajeva.", "pitanje": "Zašto se masaža bebinog stomaka kod grčeva sme raditi isključivo u smeru kazaljke na satu?", "teze": "To je anatomski smer peristaltike debelog creva (od cekuma, preko transverzalnog, do descendentnog kolona). Suprotan smer pogoršava zastoj gasova."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Vesselovi kriterijumi", "val": "Pravilo 3"}, {"lbl": "Spontano povlačenje", "val": "3-4. mesec"}, {"lbl": "Položaj olakšanja", "val": "Tigar na drvetu"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 25", "title": "Grčevi kod beba (Infantilne kolike): Smirivanje i nega", "title_styled": "Grčevi kod beba (Infantilne kolike): <em>Smirivanje i nega</em>"}, {"badge": "DERMATOLOGIJA I ALARMI", "bg_theme": "light", "category": "MODUL 4 • TEMA 26", "content_blocks": [{"bullets": ["<strong>Pelenski dermatitis (ABCDE protokol):</strong> <strong>Air (Vazduh):</strong> što više bez pelene; <strong>Barrier:</strong> mast sa <strong>cink-oksidom</strong>; <strong>Clean:</strong> pranje vodom bez maramica; <strong>Diaper:</strong> česta promena.", "<strong>Kandidijaza pelenske regije:</strong> <strong>Jarkocrveni osip sa \"satelitskim\" tačkicama u prevojima</strong>; zahteva <strong>antigljivičnu kremu po nalogu lekara</strong> (ne prolazi na običnu kremu).", "<strong>Temenjača (Cradle cap):</strong> Žućkaste masne ljuspice na temenu; omekšati <strong>bademovim uljem 30 min pre kupanja</strong>, zatim nežno iščešljati <strong>mekom četkom</strong>.", "<strong>Toplotni osip (Miliaria):</strong> Sitne crvene tačkice usled pretopljavanja; rešava se <strong>raskomoćivanjem bebe i boravkom u provetrenoj sobi (20–22°C)</strong>."], "text": "Prepoznavanje karaktera promena na koži omogućava primenu tačne terapije i sprečava širenje sekundarne infekcije.", "title": "Diferencijacija osipa i pelenski dermatitis"}, {"bullets": ["<strong>Tehnika izvođenja testa:</strong> Pritisnuti <strong>čistu providnu staklenu čašu čvrsto preko osipa</strong> na koži deteta i posmatrati kroz dno čaše.", "<strong>Benigni osip (prolazi test):</strong> Crvenilo <strong>privremeno bledi ili potpuno nestaje</strong> pod pritiskom stakla (znak uobičajene virusne reakcije).", "<strong>CRVENI ALARM (Petehije):</strong> Ako tačkice <strong>NE IZBLEDE pod pritiskom čaše</strong>, to ukazuje na potkožno krvarenje; <strong>ODMAH POZVATI HITNU POMOĆ (194)</strong>!"], "text": "Zlatni pedijatrijski test za brzo razlikovanje benignih osipa od po život opasnih meningokoknih petehija.", "title": "CRVENI ALARM: Test staklenom čašom (Tumbler Test)"}], "id": 28, "image": "slide28_skin_diaper_rash.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Naučiti polaznice diferencijalnoj dijagnozi dečjih osipa i spasilačkom izvođenju Tumbler testa čašom.", "greske": "Ignorisanje osipa koji ne bledi na pritisak i lečenje kandidijaze običnim cinkovim pastama umesto antimikoticima.", "pitanje": "Šta ukazuje pozitivan Tumbler test kada osip ne gubi boju pod pritiskom staklene čaše?", "teze": "To je znak ekstravazacije eritrocita u dermis (petehije/purpura). U kombinaciji sa febrilnošću, to je apsolutni crveni alarm za meningokokcemiju i sepsu!"}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Test staklenom čašom", "val": "Tumbler Test"}, {"lbl": "Barijera za vlagu", "val": "Cink-oksid"}, {"lbl": "Vazdušno kupanje", "val": "15-20 min"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 26", "title": "Osip po telu, pelenski osip i promene na koži", "title_styled": "Osip po telu, pelenski osip i <em>promene na koži</em>"}, {"badge": "OFTALMOLOŠKA NEGA", "bg_theme": "light", "category": "MODUL 4 • TEMA 27", "content_blocks": [{"bullets": ["<strong>Razlikovanje infekcije od suznog kanala:</strong> Bakterijski konjunktivitis zahvata <strong>beonjaču koja je crvena</strong>; stenoza suznog kanala daje <strong>sekret i suzenje bez crvenila beonjače</strong>.", "<strong>Simptomi konjunktivitisa:</strong> Obilan <strong>žućkast ili zelenkast sekret</strong> koji slepljuje trepavice nakon buđenja, otok kapaka i crvenilo oka."], "text": "Pravilno razlikovanje bakterijske infekcije od anatomske neprohodnosti suznog kanala sprečava nepotrebnu upotrebu antibiotika.", "title": "Etiologija: Infekcija vs Stenoza suznog kanala"}, {"bullets": ["<strong>Sterilna toaleta oka:</strong> Brisati <strong>sterilnom gazom natopljenom fiziološkim rastvorom (0.9% NaCl)</strong> od spoljašnjeg ugla oka ka nosu; <strong>za svaki potez nova gaza</strong>!", "<strong>Masaža suznog kanala:</strong> Kod stenoze kanala nežno masirati <strong>čistim malim prstom od unutrašnjeg ugla oka naniže duž nosića</strong> 3–4 puta dnevno.", "<strong>Kapi i masti po nalogu lekara:</strong> <strong>Antibiotske kapi primenjivati isključivo po preporuci lekara</strong>; vrh bočice <strong>nikada ne sme dodirnuti oko</strong> radi očuvanja sterilnosti.", "<strong>STROGA ZABRANA KAMILICE I MLEKA:</strong> <strong>NIKADA ne ispirati oko čajem od kamilice ili majčinim mlekom</strong> jer to drastično pogoršava infekciju!"], "text": "Higijenski protokol toalete oka i primene kapi zahteva besprekornu sterilnost.", "title": "Protokol sterilne toalete i masaže kanala"}], "id": 29, "image": "slide29_eye_infection.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti tehniku aseptične toalete oka i prepoznati razliku između stenoze suznog kanala i akutne infekcije.", "greske": "Ispiranje očiju čajem od kamilice, kapanje majčinog mleka u oko i brisanje oba oka istom gazom.", "pitanje": "Zašto se kapi za oči nikada ne smeju davati samoinicijativno bez pregleda lekara?", "teze": "Pogrešna upotreba kortikosteroidnih ili neodgovarajućih antibiotskih kapi može zamaskirati infekciju, povisiti intraokularni pritisak i trajno oštetiti vid."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Smer brisanja oka", "val": "Spolja ka unutra"}, {"lbl": "Apsolutna zabrana", "val": "0 kamilice"}, {"lbl": "Antibiotske kapi", "val": "Recept lekara"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 27", "title": "Infekcija oka kod odojčadi (Konjunktivitis)", "title_styled": "Infekcija oka kod odojčadi <em>(Konjunktivitis)</em>"}, {"badge": "RESPIRATORNA TOALETA", "bg_theme": "light", "category": "MODUL 4 • TEMA 28", "content_blocks": [{"bullets": ["<strong>Odojčad dišu isključivo na nos:</strong> U prvih 6 meseci bebe <strong>fiziološki ne umeju da dišu na usta</strong>; zapušen nos direktno <strong>onemogućava sisanje i remeti san</strong>.", "<strong>Rizik od upale uha (Otitis media):</strong> Sekret iz nosa preko <strong>kratke i široke Eustahijeve tube</strong> brzo prelazi u srednje uvo i izaziva bolne infekcije."], "text": "Anatomske specifičnosti disajnih puteva odojčeta čine i najblažu opstrukciju nosa klinički značajnom.", "title": "Zašto je zapušen nos kritičan kod odojčeta?"}, {"bullets": ["<strong>Protokol toalete fiziološkim rastvorom:</strong> Beba leži na boku; nakapati <strong>1–2 kapi sterilnog 0.9% NaCl u gornju nozdrvu</strong>; sačekati par sekundi pa ponoviti na drugom boku.", "<strong>Tehnika aspiracije nosa:</strong> Koristiti nosni aspirator <strong>isključivo pre obroka i pre spavanja</strong> (maksimalno 2–3 puta dnevno) kako se ne bi oštetila sluzokoža.", "<strong>Vlaženje vazduha:</strong> Održavati <strong>vlažnost vazduha u sobi na 50–60%</strong>; suv vazduh dodatno zgušnjava sekret i otežava disanje.", "<strong>STROGA ZABRANA DEKONGESTIVA ZA ODRASLE:</strong> Klasične kapi za nos za odrasle su <strong>STROGO ZABRANJENE kod beba</strong> zbog rizika od sistemskog trovanja i usporavanja rada srca!"], "text": "Pravilna primena fiziološkog rastvora i aspiratora razmekšava sekret i olakšava disanje bez traume sluzokože.", "title": "Klinički protokol toalete i aspiracije nosa"}], "id": 30, "image": "slide30_nasal_care.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Ovladati bezbednom tehnikom toalete i aspiracije nosa bez povređivanja nežne nazalne sluzokože.", "greske": "Aspiracija nosa odmah nakon obroka (izaziva povraćanje u mlazu) i agresivno guranje tvrdih nastavaka u nosić.", "pitanje": "Zašto se aspiracija nosa mora raditi isključivo pre obroka, a nikada neposredno posle?", "teze": "Aspiracija izaziva refleks gađenja i kašalj. Ako je želudac pun mleka, beba će momentalno povratiti, uz visok rizik od aspiracije sadržaja u pluća."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Samo na nos do 6 meseci", "val": "Obavezno disanje"}, {"lbl": "Vreme za aspiraciju", "val": "Pre podoja"}, {"lbl": "Podići uzglavlje", "val": "30°"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 28", "title": "Zapušen nos kod odojčeta (Rinitis i toaleta)", "title_styled": "Zapušen nos kod odojčeta <em>(Rinitis i toaleta)</em>"}, {"badge": "POSTVAKCINALNA NEGA", "bg_theme": "light", "category": "MODUL 4 • TEMA 29", "content_blocks": [{"bullets": ["<strong>Očekivane lokalne reakcije:</strong> Blag otok, crvenilo i bol na mestu uboda; <strong>stavljati hladne obloge od čiste gaze navlažene hladnom vodom</strong>.", "<strong>Očekivana febrilnost:</strong> Temperatura obično raste <strong>unutar 24–48 sati nakon vakcinacije</strong>; ako pređe <strong>38.5°C rektalno</strong>, dati paracetamol sirup po težini.", "<strong>BCG reakcija na ramenu:</strong> Između <strong>4. i 6. nedelje javlja se crvena kvržica ili gnojanica</strong>; normalna reakcija; <strong>ne istiskivati, ne mazati alkoholom, samo suva nega</strong>.", "<strong>Uteha i hidracija:</strong> Ponuditi <strong>češće podoje i vodu</strong>; dete može biti pospanije ili razdražljivije 1–2 dana nakon vakcinacije."], "text": "Reakcija na vakcinu je normalan imunološki odgovor organizma koji stvara zaštitna antitela.", "title": "Očekivane blage reakcije i kućna nega"}, {"bullets": ["<strong>Visoka febrilnost:</strong> Telesna temperatura <strong>preko 39.5°C koja ne reaguje na primenu antipiretika</strong>.", "<strong>Encefalitični plač:</strong> <strong>Neutješan, visokotonski prodoran plač koji traje duže od 3 sata u kontinuitetu</strong>.", "<strong>Neuroloski simptomi:</strong> <strong>Pojava konvulzija (frasa), ekstremna mlitavost ili gubitak svesti</strong> – zahtevaju <strong>hitan poziv hitnoj pomoći (194)</strong>."], "text": "Retke, ali ozbiljne reakcije zahtevaju hitnu pedijatrijsku evaluaciju bez čekanja.", "title": "Kada zvati pedijatra (Crveni alarmi)"}], "id": 31, "image": "slide25_vaccine_reactions.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Razlikovati normalne postvakcinalne reakcije od retkih ozbiljnih komplikacija i pravilno negovati mesto uboda.", "greske": "Stavljanje alkoholnih obloga na mesto uboda (peče i oštećuje kožu) i ceđenje gnojnog BCG čvorića na ramenu.", "pitanje": "Zašto se gnojni čvorić koji nastaje nakon BCG vakcinacije ne sme dirati, istiskivati niti mazati antisepticima?", "teze": "To je specifična lokalna reakcija formiranja celularnog imuniteta protiv tuberkuloze. Svaka intervencija remeti formiranje ožiljka i može izazvati superinfekciju."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Očekivane blage reakcije", "val": "24-48h"}, {"lbl": "Razvoj BCG ožiljka", "val": "3-6 nedelja"}, {"lbl": "Alarm za lekara", "val": ">39°C"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 29", "title": "Vakcinacija: Postvakcinalne reakcije i nega deteta", "title_styled": "Vakcinacija: <em>Postvakcinalne reakcije i nega deteta</em>"}, {"badge": "GASTROENTEROLOGIJA", "bg_theme": "light", "category": "MODUL 4 • TEMA 30", "content_blocks": [{"bullets": ["<strong>Fiziologija stolice kod dojene bebe:</strong> Dojena beba može imati stolicu <strong>posle svakog podoja, ali i jednom u 7–10 dana</strong> ako je meka i beba lepo napreduje.", "<strong>Definicija prave opstipacije:</strong> <strong>Tvrda, suva, kugličasta stolica</strong> (kao kod koze) koja izaziva bol, napinjanje i plač pri defekaciji.", "<strong>Masaža i vežbice:</strong> Kružna masaža stomaka u smeru kazaljke na satu i <strong>savijanje kolena ka grudima (\"vožnja bicikla\")</strong> stimulišu rad creva.", "<strong>STROGA ZABRANA TOPLOMERA U ANUS:</strong> <strong>ZABRANJENO JE izazivati stolicu guranjem toplomera, štapića ili sapuna u anus</strong> jer to trajno oštećuje refleks pražnjenja!"], "text": "Razumevanje fiziologije varenja novorođenčeta sprečava nepotrebne i invazivne intervencije.", "title": "Opstipacija kod odojčeta: Fiziologija i zablude"}, {"bullets": ["<strong>Znakovi opasne dehidracije:</strong> <strong>Uvučena velika fontanela, plač bez suza, suva usta, manje od 4 mokre pelene u 24h</strong>, ekstremna pospanost.", "<strong>Oralna rehidracija (ORS):</strong> Kod dijareje i povraćanja davati <strong>rastvor za oralnu rehidraciju kašičicom ili špricem, po 5 ml svakih 5–10 minuta</strong>.", "<strong>Nastavak dojenja:</strong> <strong>Dojenje se nikada ne prekida tokom dijareje</strong>; majčino mleko ubrzava regeneraciju crevne sluzokože."], "text": "Dijareja kod beba brzo dovodi do gubitka vode i elektrolita, što predstavlja urgentno stanje.", "title": "Dijareja i sprečavanje opasne dehidracije"}], "id": 32, "image": "slide23_digestive_dehydration.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Prepoznati rane znake dehidracije kod odojčeta i pravilno primeniti protokol oralne rehidracije (ORS).", "greske": "Prekidanje dojenja tokom proliva, davanje čistog čaja ili vode umesto elektrolita (vodi u hiponatremiju i konvulzije) i stimulacija anusa toplomerom.", "pitanje": "Zašto se kod teškog proliva detetu mora davati ORS rastvor sa elektrolitima, a ne obična prokuvana voda?", "teze": "Prolivom se gube ogromne količine natrijuma i kalijuma. Unos same vode bez elektrolita razblažuje krv, izaziva edem mozga i konvulzije."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Oralna rehidracija", "val": "ORS"}, {"lbl": "Pokazatelj hidriranosti", "val": "Fontanela"}, {"lbl": "Dojenja bez prekida", "val": "Nastavak"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 30", "title": "Digestivni poremećaji: Opstipacija i dijareja", "title_styled": "Digestivni poremećaji: <em>Opstipacija i dijareja</em>"}, {"badge": "OBARANJE TEMPERATURE", "bg_theme": "light", "category": "MODUL 4 • TEMA 31", "content_blocks": [{"bullets": ["<strong>Zlatni standard merenja:</strong> Digitalni toplomer sa savitljivim vrhom <strong>rektalno kod beba do 1 godine</strong>; rektalna temperatura je za <strong>tačno 0.5°C viša</strong> od aksilarne.", "<strong>Fiziološke granice (rektalno):</strong> Normalna: <strong>36.5–37.5°C</strong>; Subfebrilna: <strong>37.6–38.4°C</strong> (ne daju se lekovi); Febrilna: <strong>preko 38.5°C</strong> (zahteva snižavanje).", "<strong>Procena opšteg stanja deteta:</strong> Ponašanje deteta je <strong>važnije od same brojke na toplomeru</strong> – da li pije tečnost, uspostavlja kontakt očima i reaguje na okolinu."], "text": "Povišena temperatura je prirodni odbrambeni mehanizam tela u borbi protiv virusa i bakterija, a ne neprijatelj koga treba panično suzbijati na 37.5°C.", "title": "Merenje i kliničke granične vrednosti"}, {"bullets": ["<strong>Raskomoćivanje i provetravanje:</strong> Skinuti višak odeće, ostaviti <strong>samo pamučni bodić; sobna temperatura 20–21°C</strong>; nuditi tečnost često u manjim količinama.", "<strong>Tuširanje mlakom vodom (36–37°C):</strong> Tuširati dete <strong>prijatno mlakom vodom 10–15 minuta</strong>; <strong>NIKADA hladnom vodom</strong> (hladna voda izaziva drhtavicu i skok unutrašnje temperature!).", "<strong>STROGA ZABRANA ALKOHOLA I SIRĆETA:</strong> Masiranje deteta alkoholom ili sirćetom je <strong>STROGO ZABRANJENO</strong> jer se alkohol apsorbuje kroz kožu i izaziva <strong>teško trovanje i komu</strong>!", "<strong>Medikamenti po KILOGRAMIMA:</strong> <strong>Paracetamol (10–15 mg/kg) ili ibuprofen (5–10 mg/kg)</strong> isključivo po TEŽINI deteta; <strong>ASPIRIN JE ZABRANJEN pre 16. godine</strong> (Reyeov sindrom)."], "text": "Fizikalne mere rashlađivanja moraju se sprovoditi nežno i bez izazivanja drhtavice.", "title": "Fizikalne mere i stroge zabrane"}], "id": 33, "image": "slide21_fever_check_hd.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Naučiti polaznice pravilnom obaranju temperature i suzbijanju febrile fobije kod roditelja.", "greske": "Utopljavanje febrilnog deteta da se \"preznoji\", trljanje alkoholom i davanje aspirina.", "pitanje": "Zašto je aspirin strogo zabranjen za snižavanje temperature kod dece i odojčadi?", "teze": "Aspirin (acetilsalicilna kiselina) kod virusnih infekcija izaziva Reyeov sindrom – po život opasno akutno oštećenje jetre i edem mozga sa visokom smrtnošću."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Rektalno febrilno", "val": ">38.5°C"}, {"lbl": "Mlaka voda za tuširanje", "val": "36-37°C"}, {"lbl": "Stroga zabrana", "val": "0 alkohola"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 31", "title": "Visoka temperatura: Granične vrednosti i fizikalne mere", "title_styled": "Visoka temperatura: <em>Granične vrednosti i fizikalne mere</em>"}, {"badge": "PRVA POMOĆ I HITNA STANJA", "bg_theme": "light", "category": "MODUL 4 • TEMA 32", "content_blocks": [{"bullets": ["<strong>Imobilizacija i smirenje:</strong> Nakon pada ne pomerati naglo dete ako postoji sumnja na povredu vrata; pregledati zenice i pokretljivost ekstremiteta.", "<strong>Praćenje u narednih 24–48h:</strong> Pratiti stanje svesti; <strong>crveni alarmi: gubitak svesti, povraćanje u mlazu, neuobičajena pospanost, curenje bistre tečnosti iz nosa ili uha</strong>."], "text": "Pravovremena i smirena prva pomoć spasava život u prvim kritičnim minutima nakon nezgode.", "title": "Protokol kod padova i traume glave"}, {"bullets": ["<strong>Gušenje – Protokol za odojčad (do 1 godine):</strong> Postaviti bebu <strong>potrbuške duž svoje podlaktice sa glavom naniže</strong>; zadati <strong>5 energičnih udaraca korenom dlana između lopatica</strong>.", "<strong>Pritisak na grudnu kost:</strong> Ako strano telo ne izleti, okrenuti bebu na leđa i primeniti <strong>5 pritisaka sa dva prsta na sredinu grudne kosti</strong>; ponavljati ciklus i <strong>odmah pozvati 194</strong>.", "<strong>STROGA ZABRANA GURANJA PRSTIJU:</strong> <strong>NIKADA ne gurati prste na slepo u grlo deteta</strong> jer to gura strano telo dublje i potpuno zatvara disajni put!", "<strong>Opekotine – Protokol prve pomoći:</strong> Opečeno mesto odmah hladiti <strong>pod mlazom hladne tekuće vode punih 10–15 minuta</strong>; <strong>NIKADA ne mazati ulje, mast ili pastu za zube</strong>!"], "text": "Striktno poštovanje sekvence manevara prve pomoći kod gušenja i opekotina sprečava trajne posledice.", "title": "Prva pomoć: Opekotine i gušenje stranim telom"}], "id": 34, "image": "slide27_infant_choking_protocol.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Uvežbati motoričke radnje pružanja prve pomoći kod zadesnih povreda, opekotina i opstrukcije disajnih puteva.", "greske": "Premazivanje opekotina mašću ili uljem i panika sa slepim čačkanjem po bebinom grlu tokom gušenja.", "pitanje": "Koji je tačan redosled postupaka ako se odojče mlađe od godinu dana guši komadićem hrane ili igračke?", "teze": "5 udaraca između lopatica preko podlaktice sa glavom nadole, pa 5 pritisaka na grudnu kost sa dva prsta. Ponavljati dok se strano telo ne izbaci ili dete ne prodiše. Pozvati 194."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Praćenje nakon pada", "val": "48 sati"}, {"lbl": "Hlađenje opekotine", "val": "15-20 min"}, {"lbl": "Između lopatica (gušenje)", "val": "5 udaraca"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 32", "title": "Povrede i nezgode: Padovi, opekotine i gušenje", "title_styled": "Povrede i nezgode: <em>Padovi, opekotine i gušenje</em>"}, {"badge": "INFEKTIVNE BOLESTI", "bg_theme": "light", "category": "MODUL 4 • TEMA 33", "content_blocks": [{"bullets": ["<strong>Varičele (Ovčije boginje):</strong> Izbijanje vezikula (mehurića punih tečnosti) u talasima praćeno svrabom; <strong>dete je zarazno 2 dana pre osipa i dok se svi mehurići ne sasuše u kraste</strong>.", "<strong>STROGA ZABRANA IBUPROFENA KOD VARIČELA:</strong> <strong>Kod varičela je STROGO ZABRANJEN ibuprofen (Brufen)</strong> zbog rizika od smrtonosnih bakterijskih infekcija mekih tkiva; <strong>koristiti isključivo paracetamol</strong>!", "<strong>Nega kože kod varičela:</strong> Skratiti nokte detetu da se spreči češanje; tuširati blagim sindetom i <strong>nanositi penu sa nanomaterijalima koji hlade i smanjuju svrab</strong>."], "text": "Varičela je visoko zarazna virusna bolest čija nega zahteva striktno poznavanje farmakoloških zabrana.", "title": "Varičela (Ovčije boginje) i kritična pravila"}, {"bullets": ["<strong>Šarlah (Bakterijska infekcija):</strong> Crveno grlo \"kao plamen\", <strong>\"malinast\" jezik</strong> i sitan tačkast osip koji se ljušti; <strong>zahteva antibiotsku terapiju penicilinom punih 10 dana</strong>.", "<strong>Šesta bolest (Roseola):</strong> <strong>3 dana visoke temperature bez drugih simptoma</strong>, a četvrtog dana temperatura naglo pada i izbija sitan ružičasti osip po trupu.", "<strong>BRNU sindrom (Bolest usta, šaka i stopala):</strong> Bolne ranice u ustima i vezikule na dlanovima i tabanima; <strong>zahteva hladne napitke i kašastu hranu</strong> radi lakšeg gutanja."], "text": "Klinička diferencijacija uobičajenih febrilnih egzantema dečjeg uzrasta.", "title": "Šarlah, šesta bolest i BRNU sindrom"}], "id": 35, "image": "slide35_infectious_diseases.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti kliničke slike najčešćih zaraznih bolesti i zapamtiti kritično pravilo zabrane ibuprofena kod varičele.", "greske": "Davanje ibuprofena detetu sa varičelom i ignorisanje malinastog jezika kod šarlaha.", "pitanje": "Zašto je ibuprofen strogo kontraindikovan kod dece obolele od varičele (ovčijih boginja)?", "teze": "Ibuprofen slabi lokalni imuni odgovor kože i pogoduje invaziji streptokoka grupe A u potkožna tkiva, što dovodi do nekrotizirajućeg fasciitisa i sepse. Daje se isključivo paracetamol."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Ibuprofen ZABRANJEN", "val": "Varičela"}, {"lbl": "Obavezan antibiotik", "val": "Šarlah"}, {"lbl": "3 dana temp + osip", "val": "6. bolest"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 33", "title": "Zarazne bolesti dečjeg uzrasta", "title_styled": "Zarazne bolesti <em>dečjeg uzrasta</em>"}, {"badge": "UJEDI I KRPELJI", "bg_theme": "light", "category": "MODUL 4 • TEMA 34", "content_blocks": [{"bullets": ["<strong>Vađenje krpelja – Medicinski standard:</strong> Uhvatiti krpelja <strong>medicinskom pincetom što bliže koži</strong> i povući ga <strong>pravolinijski i ravnomerno na gore</strong> bez uvrtanja.", "<strong>STROGA ZABRANA NANOŠENJA HEMIKALIJA:</strong> <strong>NIKADA ne mazati krpelja uljem, alkoholom, acetonom ili sapunom</strong> jer to izaziva gušenje krpelja i povraćanje zaraženog sadržaja u krv deteta!", "<strong>Dezinfekcija nakon vađenja:</strong> Mesto uboda <strong>dezinfikovati Octeniseptom tek NAKON vađenja krpelja</strong>; ne dirati ranu prljavim rukama."], "text": "Pravilno uklanjanje krpelja unutar prvih 24 sata od uboda dramatično smanjuje rizik od prenosa Lajmske bolesti.", "title": "Medicinski protokol vađenja krpelja"}, {"bullets": ["<strong>Praćenje mesta uboda (Lajmska bolest):</strong> Pratiti mesto uboda <strong>narednih 30–40 dana</strong>; pojava crvenog prstena koji se širi (<strong>Erythema migrans</strong>) zahteva <strong>hitnu antibiotsku terapiju</strong>.", "<strong>Ujed pčele ili ose:</strong> Žaoku ukloniti <strong>struganjem ivicom plastične kartice ili noktom</strong> (ne stiskati pincetom da se ne istisne otrov); staviti <strong>hladnu oblogu</strong>.", "<strong>Crveni alarmi za anafilaksu:</strong> Otok usana, jezika, očnih kapaka, <strong>otežano disanje ili gušenje unutar 30 minuta od ujeda</strong> zahtevaju <strong>hitan poziv hitnoj pomoći (194)</strong>!"], "text": "Razlikovanje lokalne upalne reakcije od sistemske alergije i hronične bakterijske infekcije.", "title": "Ujedi pčela, osa i praćenje Lajmske bolesti"}], "id": 36, "image": "slide36_insect_bites.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti zvanični medicinski protokol vađenja krpelja i prepoznavanje ranih znakova Lajmske bolesti.", "greske": "Premazivanje krpelja uljem ili acetonom i stiskanje kesice sa otrovom prstima pri vađenju pčelinje žaoke.", "pitanje": "Zašto se krpelj ne sme premazivati uljem, alkoholom ili hemijskim sredstvima pre vađenja?", "teze": "Hemikalije izazivaju asfiksiju (gušenje) krpelja, usled čega on u samrtnom ropcu izbacuje sadržaj svojih creva pun spiroheta Borrelia burgdorferi u krv deteta."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Ravno na gore bez uvrtanja", "val": "Pinceta"}, {"lbl": "Zabrana ulja i alkohola", "val": "0 hemikalija"}, {"lbl": "Praćenje eritema migrans", "val": "30 dana"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 34", "title": "Ujedi insekata: Protokol vađenja krpelja", "title_styled": "Ujedi insekata: <em>Protokol vađenja krpelja</em>"}, {"badge": "HITNA STANJA", "bg_theme": "light", "category": "MODUL 4 • TEMA 35", "content_blocks": [{"bullets": ["<strong>Brze alergijske reakcije:</strong> Koprivnjača (urtikarija), <strong>otok usana, očnih kapaka i jezika (angioedem)</strong>, kašalj, promuklost, zviždanje u grudima, otežano disanje.", "<strong>Gastrointestinalne alergije:</strong> Naglo povraćanje u mlazu, jaki stomačni grčevi i <strong>vodenasta dijareja neposredno nakon konzumiranja alergena</strong>."], "text": "Alergije u pedijatriji variraju od blagih kožnih promena do po život opasnog anafilaktičkog šoka.", "title": "Spektar alergijskih reakcija kod dece"}, {"bullets": ["<strong>Anafilaktički šok (Hitno stanje):</strong> Nagli pad pritiska, bledilo, hladan znoj, gušenje, gubitak svesti; <strong>ODMAH POZVATI 194</strong>!", "<strong>Adrenalin autoinjektor (EpiPen):</strong> <strong>Adrenalin je JEDINI lek koji spašava život kod anafilakse</strong>; primenjuje se <strong>u spoljašnju stranu butine pod uglom od 90° i drži se pritisnut 10 sekundi</strong>.", "<strong>Položaj deteta kod šoka:</strong> Dete položiti na leđa sa <strong>podignutim nogama (Šok položaj)</strong>; ako povraća ili gubi svest, <strong>okrenuti ga na bok</strong>; nikada ne postavljati u uspravan položaj!"], "text": "Anafilaktički šok je najurgentnije stanje u pedijatriji gde minuti odlučuju o ishodu.", "title": "Prepoznavanje anafilakse i HITAN PROTOKOL"}], "id": 37, "image": "slide37_allergies_anaphylaxis.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Uvežbati hitno prepoznavanje anafilaksije i praktičnu primenu autoinjektora adrenalina (EpiPen) bez oklevanja.", "greske": "Čekanje i gubljenje vremena davanjem sirupa antihistaminika dok dete otiče u grlu umesto hitne primene adrenalina i poziva 194.", "pitanje": "Gde se anatomski aplicira autoinjektor adrenalina (EpiPen) i pod kojim uglom?", "teze": "Isključivo u spoljašnju srednju trećinu butine (musculus vastus lateralis) pod uglom od tačno 90 stepeni. Nikada u gluteus ili venu."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Momentalno pri anafilaksi", "val": "Poziv 194"}, {"lbl": "Adrenalin u butinu 90°", "val": "EpiPen Jr"}, {"lbl": "Znak otoka disajnih puteva", "val": "Stridor"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 35", "title": "Alergije i anafilaktički šok kod dece", "title_styled": "Alergije i <em>anafilaktički šok kod dece</em>"}, {"badge": "FARMACIJA I ORGANIZACIJA", "bg_theme": "light", "category": "MODUL 4 • TEMA 36", "content_blocks": [{"bullets": ["<strong>Pravilno skladištenje:</strong> Čuvati u <strong>originalnoj ambalaži sa uputstvom i rokom trajanja</strong>, na suvom i tamnom mestu (do 25°C), <strong>pod ključem ili van domašaja dece</strong>.", "<strong>Periodična revizija rokova:</strong> Najmanje <strong>jednom u 3 meseca proveriti rokove trajanja svih lekova i sirupa</strong>; lekove sa isteklim rokom odmah bezbedno odložiti."], "text": "Pravilno opremljena i bezbedno čuvana apoteka omogućava trenutnu reakciju u vanrednim situacijama.", "title": "Principi organizacije i čuvanja lekova"}, {"bullets": ["<strong>1. Antipiretici i rehidracija:</strong> <strong>Paracetamol sirup i čepići, ibuprofen sirup, kesice oralnih rehidracionih soli (ORS)</strong>.", "<strong>2. Toaleta disajnih puteva:</strong> <strong>Sterilne ampule 0.9% NaCl (fiziološki rastvor)</strong> za ispiranje nosa i očiju, nosni aspirator sa mekim nastavkom.", "<strong>3. Antiseptici i previjanje:</strong> <strong>Octenisept sprej za rane i pupčanik</strong>, sterilne gaze (5x5 i 10x10 cm), mikropor flaster, elastični zavoj, hanzaplast.", "<strong>4. Dijagnostika i doziranje:</strong> <strong>Digitalni toplomer sa savitljivim vrhom</strong>, špricevi za doziranje lekova (2 ml i 5 ml), pinceta za krpelje."], "text": "Strukturisani set medikamenata i sanitetskog materijala prilagođen uzrastu odojčeta.", "title": "4 obavezne celine pedijatrijske apoteke"}], "id": 38, "image": "slide30_apoteka_kit.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Naučiti polaznice strukturisanju, reviziji i kontroli bezbednosti pedijatrijske apoteke u domu i na putu.", "greske": "Čuvanje lekova u kupatilskom ormariću gde vlaga degradira lekove i davanje sirupa kojima je prošao rok nakon otvaranja.", "pitanje": "Zašto je u dečjoj apoteci neophodno imati antipiretike i u formi sirupa i u formi čepića?", "teze": "Ako dete ima visoku temperaturu praćenu upornim povraćanjem, sirup će odmah izbaciti. Čepić omogućava efikasnu rektalnu apsorpciju leka bez opterećenja želuca."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Struktura apoteke", "val": "4 celine"}, {"lbl": "Van domašaja dece", "val": "Zaključano"}, {"lbl": "Revizija rokova", "val": "6 meseci"}], "module": "Modul 4: Nega bolesnog deteta", "subtitle": "Modul 4: Nega bolesnog deteta • Tema 36", "title": "Zlatni standard putne i kućne apoteke za decu", "title_styled": "Zlatni standard putne i <em>kućne apoteke za decu</em>"}, {"badge": "PROTOKOL ADMINISTRACIJE", "bg_theme": "light", "category": "MODUL 4 • TEMA 37", "content_blocks": [{"bullets": ["<strong>Pravilo 5 prava (5R standard):</strong> <strong>Pravo dete, pravi lek, prava doza, pravi put primene (oralno/rektalno), pravo vreme</strong> pre svake primene leka!", "<strong>Doziranje isključivo po KILOGRAMIMA:</strong> Doza leka u pedijatriji se <strong>nikada ne računa prema godinama starosti, već isključivo prema telesnoj težini</strong>.", "<strong>Dvostruka provera (Double Check):</strong> Uvek <strong>pročitati naziv leka i koncentraciju tri puta</strong>: pri uzimanju iz apoteke, pri navlačenju u špric i pre same primene."], "text": "Međunarodni klinički standard za eliminaciju medikacijskih grešaka u radu sa decom.", "title": "Zlatnih 5 pravila bezbednosti lekova (5R)"}, {"bullets": ["<strong>Tehnika davanja oralnog sirupa:</strong> Koristiti <strong>medicinski špric za lekove</strong>; ubrizgavati tečnost <strong>lagano u unutrašnju stranu obraza (u džep obraza)</strong>, nikada direktno u grlo!", "<strong>STROGA ZABRANA MEŠANJA U PUNU FLAŠICU:</strong> <strong>NIKADA ne rastvarati lek u punu flašicu mleka ili soka</strong> jer ako dete ne popije sve, neće primiti punu dozu!", "<strong>Pravilno postavljanje čepića:</strong> Oprati ruke, dete postaviti na bok sa savijenim nožicama; <strong>staviti čepić tupim krajem napred</strong> i držati stisnute gluteuse 1–2 minuta.", "<strong>Protokol kod povraćanja leka:</strong> Ako dete povrati unutar <strong>15 minuta od davanja</strong>, doza se ponavlja u celosti; ako povrati <strong>posle 30 minuta, doza se NE ponavlja</strong>."], "text": "Pravilna tehnika primene sprečava aspiraciju leka u disajne puteve i odbijanje terapije.", "title": "Tehnika davanja peroralnih sirupa, čepića i kapi"}], "id": 39, "image": "slide31_safe_medicine_admin.png", "layout": "two_col_cards", "lecturer_notes": {"cilj": "Usvojiti protokol bezbednog doziranja i praktične veštine administracije lekova bez stresa i rizika od aspiracije.", "greske": "Doziranje leka \"odokativno\" na kašičicu, ubrizgavanje sirupa direktno na koren jezika (izaziva nagon na povraćanje) i primena hladnih kapi u uho.", "pitanje": "Zašto se oralni špric sa sirupom usmerava uz unutrašnju stranu obraza, a ne direktno u grlo?", "teze": "Mlaz usmeren direktno u grlo izaziva laringospazam, gušenje i aspiraciju u disajne puteve. Uz obraz dete refleksno guta male količine tečnosti bezbedno."}, "logo": "logo_horizontal_transparent.png", "metrics": [{"lbl": "Pravila bezbednosti", "val": "5R"}, {"lbl": "Doziranje po masi", "val": "mg / kg"}, {"lbl": "Uz unutrašnjost obraza", "val": "Oralni špric"}], "module": "Modul 4: Nega bolesnog deteta", "             if (i >= 0 && i < SLIDES.length) {
                currentIndex = i;
                renderSlide(currentIndex);
                if (isGridOpen) toggleGrid();
            }
        }

        function nextSlide() {
            if (currentIndex < SLIDES.length - 1) {
                currentIndex++;
                renderSlide(currentIndex);
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSlide(currentIndex);
            }

            isNotesOpen = !isNotesOpen;

            btnNotes.classList.toggle("active", isNotesOpen);

            isGridOpen = !isGridOpen;
            gridModal.classList.toggle("open", isGridOpen);
            if (isGridOpen) populateGrid();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        document.getElementById("btnNext").addEventListener("click", nextSlide);
        document.getElementById("btnPrev").addEventListener("click", prevSlide);
        btnNotes.addEventListener("click", toggleNotes);
        document.getElementById("btnCloseNotes").addEventListener("click", toggleNotes);
        document.getElementById("btnGrid").addEventListener("click", toggleGrid);
        document.getElementById("btnFullscreen").addEventListener("click", toggleFullscreen);
        document.getElementById("btnPrint").addEventListener("click", () => window.print());

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
                nextSlide();
            } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
                prevSlide();
            } else if (e.key.toLowerCase() === "n") {
                toggleNotes();
            } else if (e.key.toLowerCase() === "g") {
                toggleGrid();
            } else if (e.key.toLowerCase() === "f") {
                toggleFullscreen();
            } else if (e.key === "Escape") {
                if (isGridOpen) toggleGrid();
                if (isNotesOpen) toggleNotes();
            }
        });

        function initFromUrl() {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                const parsed = parseInt(hash, 10);
                if (!isNaN(parsed) && parsed >= 1 && parsed <= SLIDES.length) {
                    currentIndex = parsed - 1;
                }
            }
            renderSlide(currentIndex);
        }

        function updateSlideScale() {
            const stage = document.getElementById("stageWrapper");
            const scaler = document.getElementById("slideScaler");
            if (!stage || !scaler) return;

            const padX = 24;
            const padY = 16;
            const availW = Math.max(100, stage.clientWidth - padX);
            const availH = Math.max(100, stage.clientHeight - padY);

            const BASE_W = 1600;
            const BASE_H = 900;

            const scale = Math.min(availW / BASE_W, availH / BASE_H);
            scaler.style.setProperty("--slide-scale", scale);
        }

        window.addEventListener("resize", updateSlideScale);
        window.addEventListener("fullscreenchange", updateSlideScale);
        window.addEventListener("DOMContentLoaded", updateSlideScale);
        window.addEventListener("hashchange", initFromUrl);
        initFromUrl();
        updateSlideScale();
    </script>
</body>
</html>
